name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    # issue_comment runs on the default branch; only proceed on the keyword.
    if: >-
      github.event_name != 'issue_comment' ||
      contains(github.event.comment.body, '/release')
    runs-on: ubuntu-latest
    env:
      # v<tag> for tag pushes, otherwise v<run number> (manual dispatch / /release comment).
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags so the changelog can diff against the previous release.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The committed gradle.properties point at a local Windows JDK; drop that on CI
      # and let the toolchain / JAVA_HOME take over. Also make sure gradlew is executable.
      - name: Prepare build
        run: |
          find . -name gradle.properties -not -path '*/build/*' -exec sed -i '/org.gradle.java.home/d' {} +
          chmod +x ./gradlew

      - name: Build API + in-repo maven
        run: ./gradlew --no-daemon clean build publishRepo

      - name: Build storage-network
        run: ./gradlew --no-daemon -p storage-network clean build

      - name: Build crafting-network
        run: ./gradlew --no-daemon -p crafting-network clean build

      - name: Build all-in-one jar
        run: ./gradlew --no-daemon combinedJar

      - name: Collect release jars
        run: |
          mkdir -p dist/api
          cp build/libs/*-universal.jar dist/
          cp build/libs/*-all.jar dist/
          cp storage-network/build/libs/*-universal.jar dist/
          cp crafting-network/build/libs/*-universal.jar dist/
          # Per-loader API jars, attached to the universal API entry as additional files.
          cp fabric/build/libs/fabric-mc_storage_area_network-*.jar dist/api/ 2>/dev/null || true
          cp neoforge/build/libs/neoforge-mc_storage_area_network-*.jar dist/api/ 2>/dev/null || true
          rm -f dist/api/*-sources.jar
          ls -la dist dist/api

      # Commit-derived changelog used for CurseForge and Modrinth.
      - name: Generate changelog
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          {
            echo "Changes since ${prev:-the beginning}:"
            echo
            git log "$range" --no-merges --pretty=format:'- %s (`%h`)'
            echo
          } > dist/changelog.md
          echo "----- changelog.md -----"
          cat dist/changelog.md

      - uses: actions/upload-artifact@v4
        with:
          name: universal-jars
          path: dist/*.jar

      # Read each mod's own version from its built jar so every published version
      # gets a distinct number (required by Modrinth within a single project).
      - name: Resolve versions
        run: |
          api_ver=$(basename dist/mc-storage-area-network-*-universal.jar | sed -E 's/^mc-storage-area-network-(.*)-universal\.jar$/\1/')
          storage_ver=$(basename dist/storage-network-*-universal.jar | sed -E 's/^storage-network-(.*)-universal\.jar$/\1/')
          crafting_ver=$(basename dist/crafting-network-*-universal.jar | sed -E 's/^crafting-network-(.*)-universal\.jar$/\1/')
          bundled_ver=$(basename dist/mc-storage-area-network-*-all.jar | sed -E 's/^mc-storage-area-network-(.*)-all\.jar$/\1/')
          # Strip the leading "v" from the release tag for display names/versions.
          release_version="${RELEASE_TAG#v}"
          {
            echo "API_VER=$api_ver"
            echo "STORAGE_VER=$storage_ver"
            echo "CRAFTING_VER=$crafting_ver"
            echo "BUNDLED_VER=$bundled_ver"
            echo "RELEASE_VERSION=$release_version"
          } >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$release_version API=$api_ver Storage=$storage_ver Crafting=$crafting_ver Bundled=$bundled_ver"

      # One GitHub release containing every jar.
      - name: Publish GitHub release
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.RELEASE_TAG }}
          github-generate-changelog: true
          files: dist/*.jar
          name: MC Storage Area Network ${{ env.RELEASE_VERSION }}
          version: ${{ env.RELEASE_VERSION }}
          version-type: release

      # CurseForge and Modrinth are published in separate steps so each platform can be
      # configured and verified independently. Four entries go to the shared project:
      #   Bundled       - the all-in-one jar
      #   Universal API - the universal API jar, with the loader-specific API jars as additional files
      #   Storage       - Storage Network
      #   Crafting      - Crafting Network
      #
      # The `mc-storage-area-network` dependency is skipped on CurseForge because these all live on
      # the same project (a project cannot depend on itself).
      #
      # Modrinth `modrinth-id` must be the base62 project ID (e.g. "AANobbMI"), NOT the slug:
      # `mc-storage-area-network` contains hyphens, which Modrinth rejects while parsing that
      # field as base62. Set the repository variable `MODRINTH_ID` to the ID, or grant the
      # token the "Read projects" scope so mc-publish can resolve the slug itself.

      # --- CurseForge ---------------------------------------------------------------
      - name: Publish Bundled - CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          files: dist/mc-storage-area-network-*-all.jar
          name: Bundle ${{ env.BUNDLED_VER }}
          version: bundled-${{ env.BUNDLED_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Universal API - CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          # Universal API jar first (primary); the loader-specific API jars become additional files.
          files: |
            dist/mc-storage-area-network-*-universal.jar
            dist/api/fabric-mc_storage_area_network-*.jar
            dist/api/neoforge-mc_storage_area_network-*.jar
          name: SAN API ${{ env.API_VER }}
          version: mc-storage-area-network-${{ env.API_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Storage - CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          files: dist/storage-network-*.jar
          name: Storage Network ${{ env.STORAGE_VER }}
          version: storage-network-${{ env.STORAGE_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            mc-storage-area-network(required){modrinth:mc-storage-area-network}#(ignore:curseforge)
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Crafting - CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          files: dist/crafting-network-*.jar
          name: Crafting Network ${{ env.CRAFTING_VER }}
          version: crafting-network-${{ env.CRAFTING_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            mc-storage-area-network(required){modrinth:mc-storage-area-network}#(ignore:curseforge)
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      # --- Modrinth -----------------------------------------------------------------
      # Disabled until the project is approved (it has no project ID yet). Enable by setting
      # the repository variable `PUBLISH_MODRINTH` to `true` (and `MODRINTH_ID` to the base62
      # project ID, or grant the token "Read projects").
      - name: Publish Bundled - Modrinth
        if: ${{ vars.PUBLISH_MODRINTH == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID || 'mc-storage-area-network' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/mc-storage-area-network-*-all.jar
          name: Bundled ${{ env.RELEASE_VERSION }}
          version: bundled-${{ env.BUNDLED_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Universal API - Modrinth
        if: ${{ vars.PUBLISH_MODRINTH == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID || 'mc-storage-area-network' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            dist/mc-storage-area-network-*-universal.jar
            dist/api/fabric-mc_storage_area_network-*.jar
            dist/api/neoforge-mc_storage_area_network-*.jar
          name: Universal API ${{ env.RELEASE_VERSION }}
          version: mc-storage-area-network-${{ env.API_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Storage - Modrinth
        if: ${{ vars.PUBLISH_MODRINTH == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID || 'mc-storage-area-network' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/storage-network-*.jar
          name: Storage ${{ env.RELEASE_VERSION }}
          version: storage-network-${{ env.STORAGE_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            mc-storage-area-network(required){modrinth:mc-storage-area-network}#(ignore:curseforge)
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Crafting - Modrinth
        if: ${{ vars.PUBLISH_MODRINTH == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID || 'mc-storage-area-network' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/crafting-network-*.jar
          name: Crafting ${{ env.RELEASE_VERSION }}
          version: crafting-network-${{ env.CRAFTING_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            mc-storage-area-network(required){modrinth:mc-storage-area-network}#(ignore:curseforge)
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn
