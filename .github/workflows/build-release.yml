name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    # issue_comment runs on the default branch; only proceed on the keyword.
    if: >-
      github.event_name != 'issue_comment' ||
      contains(github.event.comment.body, '/release')
    runs-on: ubuntu-latest
    env:
      # v<tag> for tag pushes, otherwise v<run number> (manual dispatch / /release comment).
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags so the changelog can diff against the previous release.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The committed gradle.properties point at a local Windows JDK; drop that on CI
      # and let the toolchain / JAVA_HOME take over. Also make sure gradlew is executable.
      - name: Prepare build
        run: |
          find . -name gradle.properties -not -path '*/build/*' -exec sed -i '/org.gradle.java.home/d' {} +
          chmod +x ./gradlew

      - name: Build API + in-repo maven
        run: ./gradlew --no-daemon clean build publishRepo

      - name: Build storage-network
        run: ./gradlew --no-daemon -p storage-network clean build

      - name: Build crafting-network
        run: ./gradlew --no-daemon -p crafting-network clean build

      - name: Collect release jars
        run: |
          mkdir -p dist/api
          cp build/libs/*-universal.jar dist/
          cp storage-network/build/libs/*-universal.jar dist/
          cp crafting-network/build/libs/*-universal.jar dist/
          # Per-loader API jars (mod id `mc_storage_area_network`). Modrinth keys files by the
          # mod id inside them, so these are what we publish there; the universal `_bundle`
          # container jar stays for GitHub/CurseForge.
          cp fabric/build/libs/fabric-mc_storage_area_network-*.jar dist/api/ 2>/dev/null || true
          cp neoforge/build/libs/neoforge-mc_storage_area_network-*.jar dist/api/ 2>/dev/null || true
          rm -f dist/api/*-sources.jar
          ls -la dist dist/api

      # Commit-derived changelog used for CurseForge and Modrinth.
      - name: Generate changelog
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          {
            echo "Changes since ${prev:-the beginning}:"
            echo
            git log "$range" --no-merges --pretty=format:'- %s (`%h`)'
            echo
          } > dist/changelog.md
          echo "----- changelog.md -----"
          cat dist/changelog.md

      - uses: actions/upload-artifact@v4
        with:
          name: universal-jars
          path: dist/*.jar

      # Read each mod's own version from its built jar so every published version
      # gets a distinct number (required by Modrinth within a single project).
      - name: Resolve mod versions
        run: |
          api_ver=$(basename dist/mc-storage-area-network-*-universal.jar | sed -E 's/^mc-storage-area-network-(.*)-universal\.jar$/\1/')
          storage_ver=$(basename dist/storage-network-*-universal.jar | sed -E 's/^storage-network-(.*)-universal\.jar$/\1/')
          crafting_ver=$(basename dist/crafting-network-*-universal.jar | sed -E 's/^crafting-network-(.*)-universal\.jar$/\1/')
          {
            echo "API_VER=$api_ver"
            echo "STORAGE_VER=$storage_ver"
            echo "CRAFTING_VER=$crafting_ver"
          } >> "$GITHUB_ENV"
          echo "API=$api_ver Storage=$storage_ver Crafting=$crafting_ver"

      # One GitHub release containing all three jars.
      - name: Publish GitHub release
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.RELEASE_TAG }}
          github-generate-changelog: true
          files: dist/*.jar
          name: MC Storage Area Network ${{ env.RELEASE_TAG }}
          version: ${{ env.RELEASE_TAG }}
          version-type: release

      # CurseForge + Modrinth, one version per mod so each keeps its own name/subtitle
      # on the shared MC Storage Area Network project.
      #
      # IMPORTANT: keep exactly ONE file per mc-publish invocation for CurseForge.
      # mc-publish passes the 2nd+ files of a single invocation as `parentFileID`, so
      # CurseForge lists them as "additional files" nested under the first and hides them
      # from the main download page. One invocation per jar keeps all three standalone.
      # One file per mc-publish invocation per platform. mc-publish marks the 2nd+ files of a
      # single invocation as "additional" (CurseForge `parentFileID`; Modrinth non-primary),
      # so splitting keeps every jar a standalone top-level file.
      - name: Publish API to CurseForge (universal)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          # CurseForge does no mod-id matching, so the single universal jar is fine here.
          curseforge-files: dist/mc-storage-area-network-*-universal.jar
          name: MC Storage Area Network ${{ env.RELEASE_TAG }}
          version: mc-storage-area-network-${{ env.API_VER }}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      # Modrinth resolves a file to a project via the mod id inside it, and the universal
      # `_bundle` container matches nothing, so Modrinth gets the per-loader jars. Each is
      # published in its own version so neither becomes a non-primary "additional" file.
      - name: Publish API to Modrinth (Fabric)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: mc-storage-area-network
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: dist/api/fabric-mc_storage_area_network-*.jar
          name: MC Storage Area Network (Fabric) ${{ env.RELEASE_TAG }}
          version: mc-storage-area-network-fabric-${{ env.API_VER }}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: fabric
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish API to Modrinth (NeoForge)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: mc-storage-area-network
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: dist/api/neoforge-mc_storage_area_network-*.jar
          name: MC Storage Area Network (NeoForge) ${{ env.RELEASE_TAG }}
          version: mc-storage-area-network-neoforge-${{ env.API_VER }}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Storage Network
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          modrinth-id: mc-storage-area-network
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/storage-network-*.jar
          name: Storage Network ${{ env.RELEASE_TAG }}
          version: storage-network-${{ env.STORAGE_VER }}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Crafting Network
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          modrinth-id: mc-storage-area-network
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/crafting-network-*.jar
          name: Crafting Network ${{ env.RELEASE_TAG }}
          version: crafting-network-${{ env.CRAFTING_VER }}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn
