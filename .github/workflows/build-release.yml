name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    # issue_comment runs on the default branch; only proceed on the keyword.
    if: >-
      github.event_name != 'issue_comment' ||
      contains(github.event.comment.body, '/release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The committed gradle.properties point at a local Windows JDK; drop that on CI
      # and let the toolchain / JAVA_HOME take over.
      - name: Drop local java home
        run: find . -name gradle.properties -not -path '*/build/*' -exec sed -i '/org.gradle.java.home/d' {} +

      - name: Build API + in-repo maven
        run: ./gradlew --no-daemon clean build publishRepo

      - name: Build storage-network
        run: ./gradlew --no-daemon -p storage-network clean build

      - name: Build crafting-network
        run: ./gradlew --no-daemon -p crafting-network clean build

      - name: Collect universal jars
        run: |
          mkdir -p dist
          cp build/libs/*-universal.jar dist/
          cp storage-network/build/libs/*-universal.jar dist/
          cp crafting-network/build/libs/*-universal.jar dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: universal-jars
          path: dist/*.jar

      - name: Create release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'issue_comment'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          files: dist/*.jar
          generate_release_notes: true
