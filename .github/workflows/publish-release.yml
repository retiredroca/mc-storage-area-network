name: Publish Release to Platforms

# Publishes an existing GitHub release's jars to CurseForge/Modrinth (no build). Normally triggered
# by tools/release.py creating the release locally. Releases created by the build-mode workflow are
# skipped (author is github-actions[bot]); releases the local tool already published are skipped too
# (marker in the body).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)publish (e.g. v1.0.2.26091603; a leading "v" is added if omitted)'
        required: true
      minecraft:
        description: 'Minecraft version (folder under versions/)'
        default: '1.21.1'

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.release.author.login != 'github-actions[bot]' &&
       !contains(github.event.release.body, 'mc-san:published'))
    uses: ./.github/workflows/release-mod.yml
    with:
      mode: publish
      # Tags are v-prefixed; accept a manual input with or without it.
      release_tag: ${{ github.event.release.tag_name || (startsWith(github.event.inputs.tag, 'v') && github.event.inputs.tag || format('v{0}', github.event.inputs.tag)) }}
      minecraft: ${{ github.event.inputs.minecraft || '1.21.1' }}
    secrets: inherit
