name: Release All

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name != 'issue_comment' ||
      contains(github.event.comment.body, '/release-all')
    uses: ./.github/workflows/release-mod.yml
    with:
      mod: all
      release_tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.run_number) }}
    secrets: inherit
