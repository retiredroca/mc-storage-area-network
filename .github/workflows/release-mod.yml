name: Release Mod (reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: 'build = bump + build + GitHub release + publish; publish = download an existing GitHub release and publish it'
        required: false
        type: string
        default: 'build'
      mod:
        description: 'Components to re-version (build mode): api | storage | crafting | routing | all. Only the named component gets a new version and nothing infers it from the files changed, so use "all" whenever a change spans the API and one or more hosts - a narrow release leaves the other components at their old versions and mixes them into the bundles.'
        required: false
        type: string
        default: ''
      release_tag:
        description: 'Tag for this release (publish mode: required; build mode: blank to auto-compute v<api>.<stamp>)'
        required: false
        type: string
        default: ''
      minecraft:
        description: 'Minecraft version (folder under versions/)'
        required: false
        type: string
        default: '1.21.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # build mode: the triggering commit. publish mode: the released tag (so versions.properties
          # and the changelog match the jars we're about to publish).
          ref: ${{ inputs.mode == 'publish' && inputs.release_tag || github.sha }}
          # History + tags so the changelog can list recent commits and diff versions.properties.
          fetch-depth: 0

      # Read the selected Minecraft version's pins (bash only); the Java version feeds the CF
      # metadata and, in build mode, the setup-java step.
      - name: Resolve version pins
        run: |
          set -euo pipefail
          mc='${{ inputs.minecraft }}'
          props="versions/${mc}/version.properties"
          if [ ! -f "$props" ]; then
            echo "No such Minecraft version: $props" >&2
            exit 1
          fi
          java_ver=$(grep -E '^java_version=' "$props" | head -1 | cut -d= -f2)
          {
            echo "MC_VERSION=$mc"
            echo "JAVA_VERSION=${java_ver:-21}"
          } >> "$GITHUB_ENV"
          echo "Minecraft ${mc} (Java ${java_ver:-21})"

      - uses: actions/setup-java@v5
        if: ${{ inputs.mode == 'build' }}
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Drop the committed local Windows JDK path (build mode) and make the provider scripts
      # executable (both modes).
      - name: Prepare
        run: |
          find . -name gradle.properties -not -path '*/build/*' -exec sed -i '/org.gradle.java.home/d' {} +
          chmod +x ./gradlew
          chmod +x .github/scripts/*.sh

      # Only the component(s) in the trigger get a new version (the trailing yymmddhh stamp is
      # replaced; the patch is manual). Everything else keeps its version.
      - name: Bump component versions
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          mod='${{ inputs.mod }}'
          stamp=$(python3 tools/versioning.py stamp)

          api=$(grep -E '^api=' versions.properties | head -1 | cut -d= -f2)
          storage=$(grep -E '^storage=' versions.properties | head -1 | cut -d= -f2)
          crafting=$(grep -E '^crafting=' versions.properties | head -1 | cut -d= -f2)
          routing=$(grep -E '^routing=' versions.properties | head -1 | cut -d= -f2)

          api_changed=false; storage_changed=false; crafting_changed=false; routing_changed=false
          case "$mod" in
            api)      api=$(python3 tools/versioning.py bump "$api" "$stamp"); api_changed=true ;;
            storage)  storage=$(python3 tools/versioning.py bump "$storage" "$stamp"); storage_changed=true ;;
            crafting) crafting=$(python3 tools/versioning.py bump "$crafting" "$stamp"); crafting_changed=true ;;
            routing)  routing=$(python3 tools/versioning.py bump "$routing" "$stamp"); routing_changed=true ;;
            all)      api=$(python3 tools/versioning.py bump "$api" "$stamp")
                      storage=$(python3 tools/versioning.py bump "$storage" "$stamp")
                      crafting=$(python3 tools/versioning.py bump "$crafting" "$stamp")
                      routing=$(python3 tools/versioning.py bump "$routing" "$stamp")
                      api_changed=true; storage_changed=true; crafting_changed=true; routing_changed=true ;;
            *) echo "Unknown mod: $mod" >&2; exit 1 ;;
          esac

          sed -i -E "s/^api=.*/api=$api/" versions.properties
          sed -i -E "s/^storage=.*/storage=$storage/" versions.properties
          sed -i -E "s/^crafting=.*/crafting=$crafting/" versions.properties
          sed -i -E "s/^routing=.*/routing=$routing/" versions.properties
          cat versions.properties

          # Point the hosts at the (possibly new) API version floor.
          python3 tools/versioning.py floor --api "$api" --mc "${MC_VERSION}"

          # Release tag: v<api major.minor.patch>.<stamp> (an explicit input wins).
          tag='${{ inputs.release_tag }}'
          if [ -z "$tag" ]; then
            tag=$(python3 tools/versioning.py tag --api "$api" --stamp "$stamp")
          fi
          echo "Release tag: $tag"

          {
            echo "API_VERSION=$api"
            echo "STORAGE_VERSION=$storage"
            echo "CRAFTING_VERSION=$crafting"
            echo "ROUTING_VERSION=$routing"
            echo "API_CHANGED=$api_changed"
            echo "STORAGE_CHANGED=$storage_changed"
            echo "CRAFTING_CHANGED=$crafting_changed"
            echo "ROUTING_CHANGED=$routing_changed"
            echo "RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"

      # The hosts require an API version floor, so the API artifact must be resolvable before
      # they compile — publish it first.
      - name: Publish API (bootstrap)
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -p "versions/${MC_VERSION}/api/fabric" publishMavenJavaPublicationToRepoRepository
          ./gradlew --no-daemon -p "versions/${MC_VERSION}/api/neoforge" publishMavenJavaPublicationToRepoRepository

      - name: Build
        if: ${{ inputs.mode == 'build' }}
        run: ./gradlew --no-daemon -Pmc="${MC_VERSION}" --refresh-dependencies clean releaseJars publishRepo

      - name: Collect release jars
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          # Clear any pre-existing dist/ so a reused/self-hosted workspace can't leak a stale jar.
          rm -rf dist
          mkdir -p dist
          cp build/release/*.jar dist/
          ls -la dist

      # publish mode: the jars come from the GitHub release the local (or a previous) run made.
      - name: Download release assets
        if: ${{ inputs.mode == 'publish' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          gh release download '${{ inputs.release_tag }}' --dir dist --pattern '*.jar' --clobber
          ls -la dist

      # Safety net: only the expected release jars may be published. Anything else (for example a
      # leftover jar with an old name) fails the run instead of being uploaded.
      - name: Verify release jar set
        run: |
          set -euo pipefail
          allowed='^(universal|fabric|neoforge)(_mc_san_api|-storage-network|-crafting-network|-network-routing|-bundle-all|-bundle-storage|-bundle-crafting|-bundle-routing)\.[0-9].*\.jar$'
          bad=$(ls -1 dist | grep -vE "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "Unexpected file(s) in dist/ (refusing to publish):" >&2
            echo "$bad" >&2
            exit 1
          fi
          count=$(ls -1 dist/*.jar | wc -l)
          if [ "$count" -ne 24 ]; then
            echo "Expected 24 release jars, found $count:" >&2
            ls -la dist >&2
            exit 1
          fi
          echo "Release jar set OK ($count files)"

      # publish mode: read the versions from the released commit and infer which components changed
      # by diffing versions.properties against the previous tag (build mode set these when bumping).
      - name: Resolve released versions + changed components
        if: ${{ inputs.mode == 'publish' }}
        run: |
          set -euo pipefail
          tag='${{ inputs.release_tag }}'
          api=$(grep -E '^api=' versions.properties | head -1 | cut -d= -f2)
          storage=$(grep -E '^storage=' versions.properties | head -1 | cut -d= -f2)
          crafting=$(grep -E '^crafting=' versions.properties | head -1 | cut -d= -f2)
          routing=$(grep -E '^routing=' versions.properties | head -1 | cut -d= -f2)

          prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          api_changed=false; storage_changed=false; crafting_changed=false; routing_changed=false
          if [ -z "$prev" ]; then
            echo "No previous tag; treating every component as changed."
            api_changed=true; storage_changed=true; crafting_changed=true; routing_changed=true
          else
            echo "Diffing versions.properties: ${prev}..${tag}"
            diff=$(git diff "$prev" "$tag" -- versions.properties || true)
            echo "$diff"
            if echo "$diff" | grep -qE '^[-+]api='; then api_changed=true; fi
            if echo "$diff" | grep -qE '^[-+]storage='; then storage_changed=true; fi
            if echo "$diff" | grep -qE '^[-+]crafting='; then crafting_changed=true; fi
            if echo "$diff" | grep -qE '^[-+]routing='; then routing_changed=true; fi
          fi

          {
            echo "API_VERSION=$api"
            echo "STORAGE_VERSION=$storage"
            echo "CRAFTING_VERSION=$crafting"
            echo "ROUTING_VERSION=$routing"
            echo "API_CHANGED=$api_changed"
            echo "STORAGE_CHANGED=$storage_changed"
            echo "CRAFTING_CHANGED=$crafting_changed"
            echo "ROUTING_CHANGED=$routing_changed"
            echo "RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"

      # The platform changelog: the last 3 commits, then a link to the full release notes.
      - name: Generate changelog
        run: |
          set -euo pipefail
          {
            git log -3 --no-merges --pretty=format:'- %s (`%h`)'
            echo
            echo
            echo "Full changelog: https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          } > dist/changelog.md
          cat dist/changelog.md

      - name: Resolve bundle versions
        run: |
          set -euo pipefail
          ba=$(basename dist/universal-bundle-all.*.jar | sed -E 's/^universal-bundle-all\.(.*)\.jar$/\1/')
          bs=$(basename dist/universal-bundle-storage.*.jar | sed -E 's/^universal-bundle-storage\.(.*)\.jar$/\1/')
          bc=$(basename dist/universal-bundle-crafting.*.jar | sed -E 's/^universal-bundle-crafting\.(.*)\.jar$/\1/')
          br=$(basename dist/universal-bundle-routing.*.jar | sed -E 's/^universal-bundle-routing\.(.*)\.jar$/\1/')
          {
            echo "BUNDLE_ALL_VERSION=$ba"
            echo "BUNDLE_STORAGE_VERSION=$bs"
            echo "BUNDLE_CRAFTING_VERSION=$bc"
            echo "BUNDLE_ROUTING_VERSION=$br"
          } >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.mode == 'build' }}
        with:
          name: release-jars
          path: dist/*.jar

      # --- GitHub release: every jar, including the unchanged API at its current version ------
      - name: Publish GitHub release
        if: ${{ inputs.mode == 'build' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.RELEASE_TAG }}
          github-generate-changelog: true
          files: dist/*.jar
          name: MC Storage Area Network ${{ env.RELEASE_TAG }}
          version: ${{ env.RELEASE_TAG }}
          version-type: release

      # --- CurseForge -------------------------------------------------------------------------
      # A new API version creates the "SAN API" entry (API primary, storage/crafting additional).
      - name: CurseForge - new SAN API entry
        id: cf_api
        if: ${{ env.API_CHANGED == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: |
            dist/universal_mc_san_api.${{ env.API_VERSION }}.jar
            dist/universal-storage-network.${{ env.STORAGE_VERSION }}.jar
            dist/universal-crafting-network.${{ env.CRAFTING_VERSION }}.jar
            dist/universal-network-routing.${{ env.ROUTING_VERSION }}.jar
          name: SAN API ${{ env.API_VERSION }}
          version: san-api-${{ env.API_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: ${{ env.MC_VERSION }}
          loaders: |
            fabric
            neoforge
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: CurseForge - remember the SAN API file id
        if: ${{ env.API_CHANGED == 'true' }}
        run: |
          set -euo pipefail
          file_id=$(echo '${{ steps.cf_api.outputs.curseforge-files }}' | jq -r '.[0].id // empty')
          key="cf.api.file.${MC_VERSION}"
          if [ -z "$file_id" ]; then
            echo "Could not read the CurseForge file id; ${key} left unchanged."
            echo '${{ steps.cf_api.outputs.curseforge-files }}'
          elif grep -qE "^${key}=" release-state.properties; then
            sed -i -E "s|^${key}=.*|${key}=${file_id}|" release-state.properties
            echo "${key}=${file_id}"
          else
            printf '%s=%s\n' "$key" "$file_id" >> release-state.properties
            echo "${key}=${file_id}"
          fi

      # API unchanged: attach the updated mod(s) under the existing SAN API entry instead of
      # re-uploading the API. Superseded child files must be archived on the CurseForge website.
      - name: CurseForge - attach updated mods to the existing SAN API entry
        if: ${{ env.API_CHANGED == 'false' && (env.STORAGE_CHANGED == 'true' || env.CRAFTING_CHANGED == 'true' || env.ROUTING_CHANGED == 'true') }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          parent=$(grep -E "^cf\.api\.file\.${MC_VERSION}=" release-state.properties | head -1 | cut -d= -f2)
          files=()
          if [ "$STORAGE_CHANGED" = true ]; then
            files+=("dist/universal-storage-network.${STORAGE_VERSION}.jar")
          fi
          if [ "$CRAFTING_CHANGED" = true ]; then
            files+=("dist/universal-crafting-network.${CRAFTING_VERSION}.jar")
          fi
          if [ "$ROUTING_CHANGED" = true ]; then
            files+=("dist/universal-network-routing.${ROUTING_VERSION}.jar")
          fi
          ./.github/scripts/curseforge-upload.sh "$parent" "${files[@]}"

      # Bundles are their own CurseForge files. bundle-all always changes; the others only when
      # something they contain changed.
      - name: CurseForge - Bundle All
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/universal-bundle-all.${{ env.BUNDLE_ALL_VERSION }}.jar
          name: Bundle All ${{ env.BUNDLE_ALL_VERSION }}
          version: bundle-all-${{ env.BUNDLE_ALL_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: ${{ env.MC_VERSION }}
          loaders: |
            fabric
            neoforge
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: CurseForge - Bundle Storage
        if: ${{ env.API_CHANGED == 'true' || env.STORAGE_CHANGED == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/universal-bundle-storage.${{ env.BUNDLE_STORAGE_VERSION }}.jar
          name: Bundle Storage ${{ env.BUNDLE_STORAGE_VERSION }}
          version: bundle-storage-${{ env.BUNDLE_STORAGE_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: ${{ env.MC_VERSION }}
          loaders: |
            fabric
            neoforge
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: CurseForge - Bundle Crafting
        if: ${{ env.API_CHANGED == 'true' || env.CRAFTING_CHANGED == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/universal-bundle-crafting.${{ env.BUNDLE_CRAFTING_VERSION }}.jar
          name: Bundle Crafting ${{ env.BUNDLE_CRAFTING_VERSION }}
          version: bundle-crafting-${{ env.BUNDLE_CRAFTING_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: ${{ env.MC_VERSION }}
          loaders: |
            fabric
            neoforge
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: CurseForge - Bundle Routing
        if: ${{ env.API_CHANGED == 'true' || env.STORAGE_CHANGED == 'true' || env.ROUTING_CHANGED == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/universal-bundle-routing.${{ env.BUNDLE_ROUTING_VERSION }}.jar
          name: Bundle Routing ${{ env.BUNDLE_ROUTING_VERSION }}
          version: bundle-routing-${{ env.BUNDLE_ROUTING_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: ${{ env.MC_VERSION }}
          loaders: |
            fabric
            neoforge
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      # --- Modrinth (per-project versions; the previous version is archived) -------------------
      - name: Modrinth - SAN API + Bundle All
        if: ${{ vars.PUBLISH_MODRINTH == 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_GAME_VERSIONS: ${{ env.MC_VERSION }}
        run: |
          ./.github/scripts/modrinth-sync.sh \
            "${{ vars.MODRINTH_ID || 'mc-storage-area-network' }}" \
            mr.api.version.${MC_VERSION} "$API_VERSION" "SAN API $API_VERSION" \
            "dist/universal_mc_san_api.${API_VERSION}.jar" \
            "dist/universal-bundle-all.${BUNDLE_ALL_VERSION}.jar"

      - name: Modrinth - Storage Network + Bundle Storage
        if: ${{ vars.PUBLISH_MODRINTH == 'true' && (env.API_CHANGED == 'true' || env.STORAGE_CHANGED == 'true') }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_GAME_VERSIONS: ${{ env.MC_VERSION }}
        run: |
          ./.github/scripts/modrinth-sync.sh \
            "${{ vars.MODRINTH_STORAGE_ID || 'storage-network' }}" \
            mr.storage.version.${MC_VERSION} "$STORAGE_VERSION" "Storage Network $STORAGE_VERSION" \
            "dist/universal-storage-network.${STORAGE_VERSION}.jar" \
            "dist/universal-bundle-storage.${BUNDLE_STORAGE_VERSION}.jar"

      - name: Modrinth - Crafting Network + Bundle Crafting
        if: ${{ vars.PUBLISH_MODRINTH == 'true' && (env.API_CHANGED == 'true' || env.CRAFTING_CHANGED == 'true') }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_GAME_VERSIONS: ${{ env.MC_VERSION }}
        run: |
          ./.github/scripts/modrinth-sync.sh \
            "${{ vars.MODRINTH_CRAFTING_ID || 'crafting-network' }}" \
            mr.crafting.version.${MC_VERSION} "$CRAFTING_VERSION" "Crafting Network $CRAFTING_VERSION" \
            "dist/universal-crafting-network.${CRAFTING_VERSION}.jar" \
            "dist/universal-bundle-crafting.${BUNDLE_CRAFTING_VERSION}.jar"

      - name: Modrinth - Network Routing + Bundle Routing
        if: ${{ vars.PUBLISH_MODRINTH == 'true' && (env.API_CHANGED == 'true' || env.STORAGE_CHANGED == 'true' || env.ROUTING_CHANGED == 'true') }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_GAME_VERSIONS: ${{ env.MC_VERSION }}
        run: |
          ./.github/scripts/modrinth-sync.sh \
            "${{ vars.MODRINTH_ROUTING_ID || 'network-routing' }}" \
            mr.routing.version.${MC_VERSION} "$ROUTING_VERSION" "Network Routing $ROUTING_VERSION" \
            "dist/universal-network-routing.${ROUTING_VERSION}.jar" \
            "dist/universal-bundle-routing.${BUNDLE_ROUTING_VERSION}.jar"

      # --- Persist the bumped versions / learned platform ids back to main ---------------------
      - name: Commit version + release state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- versions.properties release-state.properties; then
            echo "No version/state changes to commit."
            exit 0
          fi

          git stash push -- versions.properties release-state.properties
          git fetch origin main
          git checkout -B main origin/main
          git stash pop
          git add versions.properties release-state.properties
          git commit -m "Release ${{ env.RELEASE_TAG }}: update release state"
          git push origin main
