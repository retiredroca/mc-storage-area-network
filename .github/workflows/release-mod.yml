name: Release Mod (reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: 'build = bump + build + GitHub release + publish; publish = download an existing GitHub release and publish it'
        required: false
        type: string
        default: 'build'
      mod:
        description: 'Components to re-version (build mode): api | storage | crafting | routing | access | all. Only the named component gets a new version and nothing infers it from the files changed, so use "all" whenever a change spans the API and one or more hosts - a narrow release leaves the other components at their old versions and mixes them into the bundles.'
        required: false
        type: string
        default: ''
      release_tag:
        description: 'Tag for this release (publish mode: required; build mode: blank to auto-compute v<api>.<stamp>)'
        required: false
        type: string
        default: ''
      minecraft:
        description: 'Minecraft version (folder under versions/)'
        required: false
        type: string
        default: '1.21.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # build mode: the triggering commit. publish mode: the released tag (so versions.properties
          # and the changelog match the jars we're about to publish).
          ref: ${{ inputs.mode == 'publish' && inputs.release_tag || github.sha }}
          # History + tags so the changelog can list recent commits and diff versions.properties.
          fetch-depth: 0

      # Read the selected Minecraft version's pins (bash only); the Java version feeds the CF
      # metadata and, in build mode, the setup-java step.
      - name: Resolve version pins
        run: |
          set -euo pipefail
          mc='${{ inputs.minecraft }}'
          props="versions/${mc}/version.properties"
          if [ ! -f "$props" ]; then
            echo "No such Minecraft version: $props" >&2
            exit 1
          fi
          java_ver=$(grep -E '^java_version=' "$props" | head -1 | cut -d= -f2)
          {
            echo "MC_VERSION=$mc"
            echo "JAVA_VERSION=${java_ver:-21}"
          } >> "$GITHUB_ENV"
          echo "Minecraft ${mc} (Java ${java_ver:-21})"

      - uses: actions/setup-java@v5
        if: ${{ inputs.mode == 'build' }}
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Drop the committed local Windows JDK path (build mode) and make the provider scripts
      # executable (both modes).
      - name: Prepare
        run: |
          find . -name gradle.properties -not -path '*/build/*' -exec sed -i '/org.gradle.java.home/d' {} +
          chmod +x ./gradlew
          chmod +x .github/scripts/*.sh

      # Only the component(s) in the trigger get a new version (the trailing yymmddhh stamp is
      # replaced; the patch is manual). Everything else keeps its version.
      - name: Bump module versions
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          PY
          import os, re, sys
          sys.path.insert(0, 'tools')
          import versioning, release

          mod = '${{ inputs.mod }}'
          mc = '${MC_VERSION}'
          stamp = versioning.stamp()
          path = release.VERSIONS
          # newline="\n": without it Windows text mode writes CRLF, and mc-publish then looks for
          # "dist/....26091603\r.jar" and finds nothing.
          text = path.read_text(encoding='utf-8')
          current = release.read_props(path)
          ids = release.module_ids(mc)
          if mod == 'all':
              targets = ids
          elif mod in ids:
              targets = [mod]
          else:
              sys.exit(f"unknown mod '{mod}' (known: {', '.join(ids)}, all)")
          for comp in ids:
              value = versioning.bump(current[comp], stamp) if comp in targets else current[comp]
              text = re.sub(rf'(?m)^{re.escape(comp)}=[^\r\n]*', f'{comp}={value}', text)
          path.write_text(text, encoding='utf-8', newline='\n')

          # One env var per module, plus the library and the bundle gates, all derived here rather
          # than parsed out of the file with a grep per module. The bundle gates come from
          # bundles.properties, the same file the build reads to assemble the containers, so a
          # publish step and the jar it uploads cannot be derived from different membership.
          changed = {c: c in targets for c in ids}
          (lib,) = release.library_ids(mc)
          versions = {c: (versioning.bump(current[c], stamp) if c in targets else current[c]) for c in ids}
          bundles = {n: max((versions[i] for i in m), key=release._version_key)
                     for n, m in release.bundle_definitions(mc).items()}
          cb = release.changed_bundles(mc, changed)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              for c in ids:
                  env.write(f"{c.upper()}_VERSION={versions[c]}\n")
                  env.write(f"{c.upper()}_CHANGED={'true' if changed[c] else 'false'}\n")
              env.write(f"LIBRARY={lib}\n")
              env.write(f"LIBRARY_VERSION={versions[lib]}\n")
              env.write(f"LIBRARY_CHANGED={'true' if changed[lib] else 'false'}\n")
              env.write("GAMEPLAY_CHANGED=" + ('true' if any(changed[c] for c in release.gameplay_ids(mc)) else 'false') + "\n")
              for n, v in sorted(bundles.items()):
                  env.write(f"BUNDLE_{n.upper()}_VERSION={v}\n")
                  env.write(f"PUBLISH_BUNDLE_{n.upper()}={'true' if n in cb else 'false'}\n")
              env.write("MODULE_IDS=" + ",".join(ids) + "\n")
          print(text)
          PY

          # Release tag: v<<library major.minor.patch>>.<stamp> (an explicit input wins).
          tag='${{ inputs.release_tag }}'
          if [ -z "$tag" ]; then
            tag=$(python3 tools/versioning.py tag --api "${LIBRARY_VERSION}" --stamp "$(python3 tools/versioning.py stamp)")
          fi
          echo "Release tag: $tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Publish API (bootstrap)
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -p "versions/${MC_VERSION}/api/fabric" publishMavenJavaPublicationToRepoRepository
          ./gradlew --no-daemon -p "versions/${MC_VERSION}/api/neoforge" publishMavenJavaPublicationToRepoRepository

      # Staged build so a failure names the layer that broke: loader jars, loader bundles,
      # universal jars, universal bundles. The collect step then unions them into build/release/.
      - name: Build loader jars
        if: ${{ inputs.mode == 'build' }}
        run: ./gradlew --no-daemon -Pmc="${MC_VERSION}" --refresh-dependencies releaseLoaderJars

      - name: Build loader bundles
        if: ${{ inputs.mode == 'build' }}
        run: ./gradlew --no-daemon -Pmc="${MC_VERSION}" releaseLoaderBundles

      - name: Build universal jars
        if: ${{ inputs.mode == 'build' }}
        run: ./gradlew --no-daemon -Pmc="${MC_VERSION}" releaseUniversal

      - name: Build universal bundles
        if: ${{ inputs.mode == 'build' }}
        run: ./gradlew --no-daemon -Pmc="${MC_VERSION}" releaseUniversalBundles

      - name: Collect release jars
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          # Assemble the union (build/release/) from the staged groups and republish the API to
          # ./repo; the build steps above only staged their own output directories.
          ./gradlew --no-daemon -Pmc="${MC_VERSION}" releaseJars publishRepo
          # Clear any pre-existing dist/ so a reused/self-hosted workspace can't leak a stale jar.
          rm -rf dist
          mkdir -p dist
          cp build/release/*.jar dist/
          ls -la dist

      # publish mode: the jars come from the GitHub release the local (or a previous) run made.
      - name: Download release assets
        if: ${{ inputs.mode == 'publish' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          gh release download '${{ inputs.release_tag }}' --dir dist --pattern '*.jar' --clobber
          ls -la dist
          # mc-publish defaults its `files` glob to build/libs/*.jar (see its action.yml). A real
          # build leaves jars there, which is why the CurseForge steps worked before; publish mode
          # never builds, so stage the downloaded release jars there too.
          mkdir -p build/libs
          cp dist/*.jar build/libs/

      # Safety net: only the expected release jars may be published. Anything else (for example a
      # leftover jar with an old name) fails the run instead of being uploaded.
      - name: Verify release jar set
        run: |
          set -euo pipefail
          allowed='^[A-Za-z0-9_-]+-[0-9][0-9.]*-(fabric|neoforge|universal)\.jar$'
          bad=$(ls -1 dist | grep -vE "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "Unexpected file(s) in dist/ (refusing to publish):" >&2
            echo "$bad" >&2
            exit 1
          fi
          count=$(ls -1 dist/*.jar | wc -l)
          if [ "$count" -ne 30 ]; then
            echo "Expected 30 release jars, found $count:" >&2
            ls -la dist >&2
            exit 1
          fi
          echo "Release jar set OK ($count files)"

      # publish mode: read the versions from the released commit and infer which components changed
      # by diffing versions.properties against the previous tag (build mode set these when bumping).
      - name: Resolve released versions + changed modules
        if: ${{ inputs.mode == 'publish' }}
        run: |
          set -euo pipefail
          PY
          import os, re, subprocess, sys
          sys.path.insert(0, 'tools')
          import versioning, release

          tag = '${{ inputs.release_tag }}'
          mc = '${MC_VERSION}'
          # Read through release.read_props rather than a grep per module: a module added to
          # versions.properties would otherwise be published with no version and no changed flag.
          current = release.read_props(release.VERSIONS)
          ids = release.module_ids(mc)
          missing = [c for c in ids if c not in current]
          if missing:
              sys.exit(f"versions.properties is missing {missing}")

          def git(*args):
              return subprocess.run(['git', *args], capture_output=True, text=True).stdout

          prev = git('describe', '--tags', '--abbrev=0', f'{tag}^').strip()
          if not prev:
              print('No previous tag; treating every module as changed.')
              changed = set(ids)
          else:
              print(f'Diffing versions.properties: {prev}..{tag}')
              diff = git('diff', prev, tag, '--', 'versions.properties')
              print(diff)
              # One regex per module, built from the discovered ids, instead of a hand-written
              # grep per module.
              changed = {c for c in ids if re.search(rf'^[-+]{re.escape(c)}=', diff, re.M)}

          flags = {c: c in changed for c in ids}
          (lib,) = release.library_ids(mc)
          bundles = {n: max((current[i] for i in m), key=release._version_key)
                     for n, m in release.bundle_definitions(mc).items()}
          cb = release.changed_bundles(mc, flags)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              for c in ids:
                  env.write(f"{c.upper()}_VERSION={current[c]}\n")
                  env.write(f"{c.upper()}_CHANGED={'true' if flags[c] else 'false'}\n")
              env.write(f"LIBRARY={lib}\n")
              env.write(f"LIBRARY_VERSION={current[lib]}\n")
              env.write(f"LIBRARY_CHANGED={'true' if flags[lib] else 'false'}\n")
              env.write("GAMEPLAY_CHANGED=" + ('true' if any(flags[c] for c in release.gameplay_ids(mc)) else 'false') + "\n")
              for n, v in sorted(bundles.items()):
                  env.write(f"BUNDLE_{n.upper()}_VERSION={v}\n")
                  env.write(f"PUBLISH_BUNDLE_{n.upper()}={'true' if n in cb else 'false'}\n")
              env.write("MODULE_IDS=" + ",".join(ids) + "\n")
              env.write(f"RELEASE_TAG={tag}\n")
          PY
        env:
          MC_VERSION: ${{ env.MC_VERSION }}

      - name: Generate changelog
        run: |
          set -euo pipefail
          {
            git log -3 --no-merges --pretty=format:'- %s (`%h`)'
            echo
            echo
            echo "Full changelog: https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          } > dist/changelog.md
          cat dist/changelog.md

      - name: Resolve bundle versions
        run: |
          set -euo pipefail
          # The bundle containers were already named and written by the build; their versions are
          # recomputed from versions.properties + bundles.properties and checked against dist/,
          # rather than recovered by slicing a substring out of each jar's filename.
          PY
          import sys
          sys.path.insert(0, 'tools')
          import release
          mc = '${MC_VERSION}'
          versions = release.read_props(release.VERSIONS)
          bundles = release.bundle_versions(mc, versions)
          for name in sorted(bundles):
              print(f"bundle-{name}: {bundles[name]}")
          PY

      - name: Publish GitHub release
        if: ${{ inputs.mode == 'build' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.RELEASE_TAG }}
          github-generate-changelog: true
          files: dist/*.jar
          name: MC Storage Area Network ${{ env.RELEASE_TAG }}
          version: ${{ env.RELEASE_TAG }}
          version-type: release

      # --- CurseForge -------------------------------------------------------------------------
      # mc-publish resolves its default `files` glob (build/libs/*.jar) for every step, even the
      # CurseForge-only ones. A build used to leave jars there, so publish mode stages the
      # downloaded release jars into build/libs/ (see "Download release assets") rather than
      # overriding `files` on each CurseForge step.
      # A new API version creates the "SAN API" entry (API primary, storage/crafting additional).
      - name: CurseForge - new SAN API entry
        id: cf_api
        if: ${{ env.LIBRARY_CHANGED == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: |
            dist/mc_storage_area_network-${{ env.LIBRARY_VERSION }}-universal.jar
            dist/storage_network-${{ env.STORAGE_NETWORK_VERSION }}-universal.jar
            dist/crafting_network-${{ env.CRAFTING_NETWORK_VERSION }}-universal.jar
            dist/network_routing-${{ env.NETWORK_ROUTING_VERSION }}-universal.jar
            dist/remote_access_terminal-${{ env.REMOTE_ACCESS_TERMINAL_VERSION }}-universal.jar
          name: SAN API ${{ env.LIBRARY_VERSION }}
          version: san-api-${{ env.LIBRARY_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: ${{ env.MC_VERSION }}
          loaders: |
            fabric
            neoforge
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: CurseForge - remember the SAN API file id
        if: ${{ env.LIBRARY_CHANGED == 'true' }}
        run: |
          set -euo pipefail
          file_id=$(echo '${{ steps.cf_api.outputs.curseforge-files }}' | jq -r '.[0].id // empty')
          key="cf.api.file.${MC_VERSION}"
          if [ -z "$file_id" ]; then
            echo "Could not read the CurseForge file id; ${key} left unchanged."
            echo '${{ steps.cf_api.outputs.curseforge-files }}'
          elif grep -qE "^${key}=" release-state.properties; then
            sed -i -E "s|^${key}=.*|${key}=${file_id}|" release-state.properties
            echo "${key}=${file_id}"
          else
            printf '%s=%s\n' "$key" "$file_id" >> release-state.properties
            echo "${key}=${file_id}"
          fi

      # API unchanged: attach the updated mod(s) under the existing SAN API entry instead of
      # re-uploading the API. Superseded child files must be archived on the CurseForge website.
      - name: CurseForge - attach updated mods to the existing SAN API entry
        if: ${{ env.LIBRARY_CHANGED == 'false' && env.GAMEPLAY_CHANGED == 'true' }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          parent=$(grep -E "^cf\.api\.file\.${MC_VERSION}=" release-state.properties | head -1 | cut -d= -f2)
          # Which modules changed is a fact the bump step already computed; this walks the module
          # list rather than naming four modules, so a new one is attached with no edit here.
          files=()
          IFS=',' read -ra ids <<< "$MODULE_IDS"
          for id in "${ids[@]}"; do
            if [ "$id" = "$LIBRARY" ]; then continue; fi
            var="$(printf '%s' "$id" | tr '[:lower:]' '[:upper:]')"
            eval "changed=\${${var}_CHANGED}"
            eval "version=\${${var}_VERSION}"
            if [ "$changed" = true ]; then
              files+=("dist/${id}-${version}-universal.jar")
            fi
          done
          ./.github/scripts/curseforge-upload.sh "$parent" "${files[@]}"

      # Bundles are their own CurseForge files. bundle-all always changes; the others only when
      # something they contain changed.
      - name: CurseForge - Bundle All
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/bundle-all-${{ env.BUNDLE_ALL_VERSION }}-universal.jar
          name: Bundle All ${{ env.BUNDLE_ALL_VERSION }}
          version: bundle-all-${{ env.BUNDLE_ALL_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: ${{ env.MC_VERSION }}
          loaders: |
            fabric
            neoforge
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: CurseForge - Bundle Storage
        if: ${{ env.PUBLISH_BUNDLE_STORAGE == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/bundle-storage-${{ env.BUNDLE_STORAGE_VERSION }}-universal.jar
          name: Bundle Storage ${{ env.BUNDLE_STORAGE_VERSION }}
          version: bundle-storage-${{ env.BUNDLE_STORAGE_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: ${{ env.MC_VERSION }}
          loaders: |
            fabric
            neoforge
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: CurseForge - Bundle Crafting
        if: ${{ env.PUBLISH_BUNDLE_CRAFTING == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/bundle-crafting-${{ env.BUNDLE_CRAFTING_VERSION }}-universal.jar
          name: Bundle Crafting ${{ env.BUNDLE_CRAFTING_VERSION }}
          version: bundle-crafting-${{ env.BUNDLE_CRAFTING_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: ${{ env.MC_VERSION }}
          loaders: |
            fabric
            neoforge
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: CurseForge - Bundle Routing
        if: ${{ env.PUBLISH_BUNDLE_ROUTING == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/bundle-routing-${{ env.BUNDLE_ROUTING_VERSION }}-universal.jar
          name: Bundle Routing ${{ env.BUNDLE_ROUTING_VERSION }}
          version: bundle-routing-${{ env.BUNDLE_ROUTING_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: ${{ env.MC_VERSION }}
          loaders: |
            fabric
            neoforge
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: CurseForge - Bundle Access
        if: ${{ env.PUBLISH_BUNDLE_ACCESS == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/bundle-access-${{ env.BUNDLE_ACCESS_VERSION }}-universal.jar
          name: Bundle Access ${{ env.BUNDLE_ACCESS_VERSION }}
          version: bundle-access-${{ env.BUNDLE_ACCESS_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: ${{ env.MC_VERSION }}
          loaders: |
            fabric
            neoforge
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      # --- Modrinth (per-project versions; the previous version is archived) -------------------
      - name: Modrinth - SAN API + Bundle All
        if: ${{ vars.PUBLISH_MODRINTH == 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_GAME_VERSIONS: ${{ env.MC_VERSION }}
        run: |
          ./.github/scripts/modrinth-sync.sh \
            "${{ vars.MODRINTH_ID || 'mc-storage-area-network' }}" \
            mr.api.version.${MC_VERSION} "$LIBRARY_VERSION" "SAN API $LIBRARY_VERSION" \
            "dist/mc_storage_area_network-${LIBRARY_VERSION}-universal.jar" \
            "dist/bundle-all-${BUNDLE_ALL_VERSION}-universal.jar"

      - name: Modrinth - Storage Network + Bundle Storage
        if: ${{ vars.PUBLISH_MODRINTH == 'true' && (env.PUBLISH_BUNDLE_STORAGE == 'true') }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_GAME_VERSIONS: ${{ env.MC_VERSION }}
        run: |
          ./.github/scripts/modrinth-sync.sh \
            "${{ vars.MODRINTH_STORAGE_ID || 'storage-network' }}" \
            mr.storage.version.${MC_VERSION} "$STORAGE_NETWORK_VERSION" "Storage Network $STORAGE_NETWORK_VERSION" \
            "dist/storage_network-${STORAGE_NETWORK_VERSION}-universal.jar" \
            "dist/bundle-storage-${BUNDLE_STORAGE_VERSION}-universal.jar"

      - name: Modrinth - Crafting Network + Bundle Crafting
        if: ${{ vars.PUBLISH_MODRINTH == 'true' && (env.PUBLISH_BUNDLE_CRAFTING == 'true') }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_GAME_VERSIONS: ${{ env.MC_VERSION }}
        run: |
          ./.github/scripts/modrinth-sync.sh \
            "${{ vars.MODRINTH_CRAFTING_ID || 'crafting-network' }}" \
            mr.crafting.version.${MC_VERSION} "$CRAFTING_NETWORK_VERSION" "Crafting Network $CRAFTING_NETWORK_VERSION" \
            "dist/crafting_network-${CRAFTING_NETWORK_VERSION}-universal.jar" \
            "dist/bundle-crafting-${BUNDLE_CRAFTING_VERSION}-universal.jar"

      - name: Modrinth - Network Routing + Bundle Routing
        if: ${{ vars.PUBLISH_MODRINTH == 'true' && (env.PUBLISH_BUNDLE_ROUTING == 'true') }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_GAME_VERSIONS: ${{ env.MC_VERSION }}
        run: |
          ./.github/scripts/modrinth-sync.sh \
            "${{ vars.MODRINTH_ROUTING_ID || 'network-routing' }}" \
            mr.routing.version.${MC_VERSION} "$NETWORK_ROUTING_VERSION" "Network Routing $NETWORK_ROUTING_VERSION" \
            "dist/network_routing-${NETWORK_ROUTING_VERSION}-universal.jar" \
            "dist/bundle-routing-${BUNDLE_ROUTING_VERSION}-universal.jar"

      # Remote Access Terminal shares the suite's Modrinth project, so it has no project variable of
      # its own; only the state key (which version to archive) is per-component.
      - name: Modrinth - Remote Access Terminal + Bundle Access
        if: ${{ vars.PUBLISH_MODRINTH == 'true' && (env.PUBLISH_BUNDLE_ACCESS == 'true') }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_GAME_VERSIONS: ${{ env.MC_VERSION }}
        run: |
          ./.github/scripts/modrinth-sync.sh \
            "${{ vars.MODRINTH_ID || 'mc-storage-area-network' }}" \
            mr.access.version.${MC_VERSION} "$REMOTE_ACCESS_TERMINAL_VERSION" "Remote Access Terminal $REMOTE_ACCESS_TERMINAL_VERSION" \
            "dist/remote_access_terminal-${REMOTE_ACCESS_TERMINAL_VERSION}-universal.jar" \
            "dist/bundle-access-${BUNDLE_ACCESS_VERSION}-universal.jar"

      # --- Persist the bumped versions / learned platform ids back to main ---------------------
      # Runs on failure as well as success, but not on cancellation. A platform upload can fail
      # after another platform has already learned new ids (e.g. CurseForge creates the "SAN API"
      # entry and records its file id before Modrinth runs), and without this the job would stop at
      # the failed upload and silently discard those ids, so the next release would create yet
      # another entry instead of reusing the one just uploaded.
      - name: Commit version + release state
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- versions.properties release-state.properties; then
            echo "No version/state changes to commit."
            exit 0
          fi

          git stash push -- versions.properties release-state.properties
          git fetch origin main
          git checkout -B main origin/main
          git stash pop
          git add versions.properties release-state.properties
          git commit -m "Release ${{ env.RELEASE_TAG }}: update release state"
          git push origin main
