name: Release Mod (reusable)

on:
  workflow_call:
    inputs:
      mod:
        description: 'Which mod triggered this release: api | storage | crafting | all'
        required: true
        type: string
      release_tag:
        description: 'Git tag / version for this release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags so the changelog can diff against the previous release.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The committed gradle.properties point at a local Windows JDK; drop that on CI
      # and let the toolchain / JAVA_HOME take over.
      - name: Prepare
        run: |
          find . -name gradle.properties -not -path '*/build/*' -exec sed -i '/org.gradle.java.home/d' {} +
          chmod +x ./gradlew
          chmod +x .github/scripts/*.sh

      # Only the component(s) in the trigger get a new version. Everything else keeps
      # its version (and is still compiled, so bundles always have a local jar).
      - name: Bump component versions
        run: |
          set -euo pipefail
          mod='${{ inputs.mod }}'
          stamp=$(date -u +%y%m%d%H)

          api=$(grep -E '^api=' versions.properties | head -1 | cut -d= -f2)
          storage=$(grep -E '^storage=' versions.properties | head -1 | cut -d= -f2)
          crafting=$(grep -E '^crafting=' versions.properties | head -1 | cut -d= -f2)

          api_changed=false
          storage_changed=false
          crafting_changed=false
          case "$mod" in
            api)      api="1.0.$stamp"; api_changed=true ;;
            storage)  storage="1.0.0.$stamp"; storage_changed=true ;;
            crafting) crafting="1.0.0.$stamp"; crafting_changed=true ;;
            all)      api="1.0.$stamp"; storage="1.0.0.$stamp"; crafting="1.0.0.$stamp"
                      api_changed=true; storage_changed=true; crafting_changed=true ;;
            *) echo "Unknown mod: $mod" >&2; exit 1 ;;
          esac

          sed -i -E "s/^api=.*/api=$api/" versions.properties
          sed -i -E "s/^storage=.*/storage=$storage/" versions.properties
          sed -i -E "s/^crafting=.*/crafting=$crafting/" versions.properties
          cat versions.properties

          {
            echo "API_VERSION=$api"
            echo "STORAGE_VERSION=$storage"
            echo "CRAFTING_VERSION=$crafting"
            echo "API_CHANGED=$api_changed"
            echo "STORAGE_CHANGED=$storage_changed"
            echo "CRAFTING_CHANGED=$crafting_changed"
          } >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew --no-daemon clean releaseJars publishRepo

      - name: Collect release jars
        run: |
          mkdir -p dist
          cp build/release/*.jar dist/
          ls -la dist

      - name: Generate changelog
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          {
            echo "Changes since ${prev:-the beginning}:"
            echo
            git log "$range" --no-merges --pretty=format:'- %s (`%h`)'
            echo
            echo
            echo "Loader-specific builds (Fabric / NeoForge single-loader jars) are published on GitHub:"
            echo "https://github.com/${{ github.repository }}/releases/latest"
          } > dist/changelog.md
          cat dist/changelog.md

      - name: Resolve bundle versions
        run: |
          set -euo pipefail
          ba=$(basename dist/universal-bundle-all.*.jar | sed -E 's/^universal-bundle-all\.(.*)\.jar$/\1/')
          bs=$(basename dist/universal-bundle-storage.*.jar | sed -E 's/^universal-bundle-storage\.(.*)\.jar$/\1/')
          bc=$(basename dist/universal-bundle-crafting.*.jar | sed -E 's/^universal-bundle-crafting\.(.*)\.jar$/\1/')
          {
            echo "BUNDLE_ALL_VERSION=$ba"
            echo "BUNDLE_STORAGE_VERSION=$bs"
            echo "BUNDLE_CRAFTING_VERSION=$bc"
          } >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: dist/*.jar

      # --- GitHub release: every jar, including the unchanged API at its current version ------
      - name: Publish GitHub release
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ inputs.release_tag }}
          github-generate-changelog: true
          files: dist/*.jar
          name: MC Storage Area Network ${{ inputs.release_tag }}
          version: ${{ inputs.release_tag }}
          version-type: release

      # --- CurseForge -------------------------------------------------------------------------
      # A new API version creates the "SAN API" entry (API primary, storage/crafting additional).
      - name: CurseForge - new SAN API entry
        id: cf_api
        if: ${{ env.API_CHANGED == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: |
            dist/universal_mc_san_api.${{ env.API_VERSION }}.jar
            dist/universal-storage-network.${{ env.STORAGE_VERSION }}.jar
            dist/universal-crafting-network.${{ env.CRAFTING_VERSION }}.jar
          name: SAN API ${{ env.API_VERSION }}
          version: san-api-${{ env.API_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: CurseForge - remember the SAN API file id
        if: ${{ env.API_CHANGED == 'true' }}
        run: |
          set -euo pipefail
          file_id=$(echo '${{ steps.cf_api.outputs.curseforge-files }}' | jq -r '.[0].id // empty')
          if [ -z "$file_id" ]; then
            echo "Could not read the CurseForge file id; cf.api.file left unchanged."
            echo '${{ steps.cf_api.outputs.curseforge-files }}'
          else
            sed -i -E "s/^cf.api.file=.*/cf.api.file=$file_id/" release-state.properties
            echo "cf.api.file=$file_id"
          fi

      # API unchanged: attach the updated mod(s) under the existing SAN API entry instead of
      # re-uploading the API. Superseded child files must be archived on the CurseForge website.
      - name: CurseForge - attach updated mods to the existing SAN API entry
        if: ${{ env.API_CHANGED == 'false' && (env.STORAGE_CHANGED == 'true' || env.CRAFTING_CHANGED == 'true') }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          parent=$(grep -E '^cf.api.file=' release-state.properties | head -1 | cut -d= -f2)
          files=()
          if [ "$STORAGE_CHANGED" = true ]; then
            files+=("dist/universal-storage-network.${STORAGE_VERSION}.jar")
          fi
          if [ "$CRAFTING_CHANGED" = true ]; then
            files+=("dist/universal-crafting-network.${CRAFTING_VERSION}.jar")
          fi
          ./.github/scripts/curseforge-upload.sh "$parent" "${files[@]}"

      # Bundles are their own CurseForge files. bundle-all always changes; the others only when
      # something they contain changed.
      - name: CurseForge - Bundle All
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/universal-bundle-all.${{ env.BUNDLE_ALL_VERSION }}.jar
          name: Bundle All ${{ env.BUNDLE_ALL_VERSION }}
          version: bundle-all-${{ env.BUNDLE_ALL_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: CurseForge - Bundle Storage
        if: ${{ env.API_CHANGED == 'true' || env.STORAGE_CHANGED == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/universal-bundle-storage.${{ env.BUNDLE_STORAGE_VERSION }}.jar
          name: Bundle Storage ${{ env.BUNDLE_STORAGE_VERSION }}
          version: bundle-storage-${{ env.BUNDLE_STORAGE_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: CurseForge - Bundle Crafting
        if: ${{ env.API_CHANGED == 'true' || env.CRAFTING_CHANGED == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/universal-bundle-crafting.${{ env.BUNDLE_CRAFTING_VERSION }}.jar
          name: Bundle Crafting ${{ env.BUNDLE_CRAFTING_VERSION }}
          version: bundle-crafting-${{ env.BUNDLE_CRAFTING_VERSION }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      # --- Modrinth (per-project versions; the previous version is archived) -------------------
      - name: Modrinth - SAN API + Bundle All
        if: ${{ vars.PUBLISH_MODRINTH == 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          ./.github/scripts/modrinth-sync.sh \
            "${{ vars.MODRINTH_ID || 'mc-storage-area-network' }}" \
            mr.api.version "$API_VERSION" "SAN API $API_VERSION" \
            "dist/universal_mc_san_api.${API_VERSION}.jar" \
            "dist/universal-bundle-all.${BUNDLE_ALL_VERSION}.jar"

      - name: Modrinth - Storage Network + Bundle Storage
        if: ${{ vars.PUBLISH_MODRINTH == 'true' && (env.API_CHANGED == 'true' || env.STORAGE_CHANGED == 'true') }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          ./.github/scripts/modrinth-sync.sh \
            "${{ vars.MODRINTH_STORAGE_ID || 'storage-network' }}" \
            mr.storage.version "$STORAGE_VERSION" "Storage Network $STORAGE_VERSION" \
            "dist/universal-storage-network.${STORAGE_VERSION}.jar" \
            "dist/universal-bundle-storage.${BUNDLE_STORAGE_VERSION}.jar"

      - name: Modrinth - Crafting Network + Bundle Crafting
        if: ${{ vars.PUBLISH_MODRINTH == 'true' && (env.API_CHANGED == 'true' || env.CRAFTING_CHANGED == 'true') }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          ./.github/scripts/modrinth-sync.sh \
            "${{ vars.MODRINTH_CRAFTING_ID || 'crafting-network' }}" \
            mr.crafting.version "$CRAFTING_VERSION" "Crafting Network $CRAFTING_VERSION" \
            "dist/universal-crafting-network.${CRAFTING_VERSION}.jar" \
            "dist/universal-bundle-crafting.${BUNDLE_CRAFTING_VERSION}.jar"

      # --- Persist the bumped versions / learned platform ids back to main ---------------------
      - name: Commit version + release state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- versions.properties release-state.properties; then
            echo "No version/state changes to commit."
            exit 0
          fi

          git stash push -- versions.properties release-state.properties
          git fetch origin main
          git checkout -B main origin/main
          git stash pop
          git add versions.properties release-state.properties
          git commit -m "Release ${{ inputs.release_tag }}: bump ${{ inputs.mod }} version"
          git push origin main
