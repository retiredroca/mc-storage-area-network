name: Release Mod (reusable)

on:
  workflow_call:
    inputs:
      mod:
        description: 'Which mod to publish: api | storage | crafting | all'
        required: true
        type: string
      release_tag:
        description: 'Git tag / version for this release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags so the changelog can diff against the previous release.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The committed gradle.properties point at a local Windows JDK; drop that on CI
      # and let the toolchain / JAVA_HOME take over. Also make sure gradlew is executable.
      - name: Prepare build
        run: |
          find . -name gradle.properties -not -path '*/build/*' -exec sed -i '/org.gradle.java.home/d' {} +
          chmod +x ./gradlew

      # Every mod build needs the others' outputs to assemble the all-in-one bundle.
      - name: Build API + in-repo maven
        run: ./gradlew --no-daemon clean build publishRepo
      - name: Build storage-network
        run: ./gradlew --no-daemon -p storage-network clean build
      - name: Build crafting-network
        run: ./gradlew --no-daemon -p crafting-network clean build
      - name: Build all-in-one jar
        run: ./gradlew --no-daemon combinedJar

      - name: Collect release jars
        run: |
          mkdir -p dist/api
          cp build/libs/*-universal.jar dist/
          cp build/libs/*-all.jar dist/
          cp storage-network/build/libs/*-universal.jar dist/
          cp crafting-network/build/libs/*-universal.jar dist/
          # Per-loader API jars (the universal bundle is not detectable by Modrinth).
          cp fabric/build/libs/fabric-mc_storage_area_network-*.jar dist/api/ 2>/dev/null || true
          cp neoforge/build/libs/neoforge-mc_storage_area_network-*.jar dist/api/ 2>/dev/null || true
          rm -f dist/api/*-sources.jar
          ls -la dist dist/api

      # Commit-derived changelog used for CurseForge and Modrinth.
      - name: Generate changelog
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          {
            echo "Changes since ${prev:-the beginning}:"
            echo
            git log "$range" --no-merges --pretty=format:'- %s (`%h`)'
            echo
          } > dist/changelog.md
          cat dist/changelog.md

      # Read each mod's own version and pick the GitHub asset set for the requested mod.
      - name: Resolve versions
        run: |
          api_ver=$(basename dist/mc-storage-area-network-*-universal.jar | sed -E 's/^mc-storage-area-network-(.*)-universal\.jar$/\1/')
          storage_ver=$(basename dist/storage-network-*-universal.jar | sed -E 's/^storage-network-(.*)-universal\.jar$/\1/')
          crafting_ver=$(basename dist/crafting-network-*-universal.jar | sed -E 's/^crafting-network-(.*)-universal\.jar$/\1/')
          bundled_ver=$(basename dist/mc-storage-area-network-*-all.jar | sed -E 's/^mc-storage-area-network-(.*)-all\.jar$/\1/')
          case "${{ inputs.mod }}" in
            api) gh_files=$(printf '%s\n' \
              'dist/mc-storage-area-network-*-universal.jar' \
              'dist/mc-storage-area-network-*-all.jar') ;;
            storage) gh_files=$(printf '%s\n' \
              'dist/storage-network-*.jar' \
              'dist/mc-storage-area-network-*-all.jar') ;;
            crafting) gh_files=$(printf '%s\n' \
              'dist/crafting-network-*.jar' \
              'dist/mc-storage-area-network-*-all.jar') ;;
            all) gh_files=$(printf '%s\n' \
              'dist/mc-storage-area-network-*-universal.jar' \
              'dist/storage-network-*.jar' \
              'dist/crafting-network-*.jar' \
              'dist/mc-storage-area-network-*-all.jar') ;;
            *) echo "Unknown mod: ${{ inputs.mod }}"; exit 1 ;;
          esac
          {
            echo "API_VER=$api_ver"
            echo "STORAGE_VER=$storage_ver"
            echo "CRAFTING_VER=$crafting_ver"
            echo "BUNDLED_VER=$bundled_ver"
            echo "GH_FILES<<EOF"
            echo "$gh_files"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "API=$api_ver Storage=$storage_ver Crafting=$crafting_ver Bundled=$bundled_ver"

      - uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: dist/*.jar

      # --- GitHub release ----------------------------------------------------------
      - name: Publish GitHub release
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ inputs.release_tag }}
          github-generate-changelog: true
          files: ${{ env.GH_FILES }}
          name: MC Storage Area Network ${{ inputs.release_tag }}
          version: ${{ inputs.release_tag }}
          version-type: release

      # --- CurseForge: the mod(s) + the bundle -------------------------------------
      - name: Publish API - CurseForge
        if: ${{ inputs.mod == 'api' || inputs.mod == 'all' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          # Universal API jar first (primary); the loader-specific API jars become additional files.
          curseforge-files: |
            dist/mc-storage-area-network-*-universal.jar
            dist/api/fabric-mc_storage_area_network-*.jar
            dist/api/neoforge-mc_storage_area_network-*.jar
          name: SAN API ${{ env.API_VER }}
          version: mc-storage-area-network-${{ env.API_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Storage - CurseForge
        if: ${{ inputs.mod == 'storage' || inputs.mod == 'all' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/storage-network-*.jar
          name: Storage Network ${{ env.STORAGE_VER }}
          version: storage-network-${{ env.STORAGE_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            mc-storage-area-network(required){modrinth:mc-storage-area-network}#(ignore:curseforge)
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Crafting - CurseForge
        if: ${{ inputs.mod == 'crafting' || inputs.mod == 'all' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/crafting-network-*.jar
          name: Crafting Network ${{ env.CRAFTING_VER }}
          version: crafting-network-${{ env.CRAFTING_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            mc-storage-area-network(required){modrinth:mc-storage-area-network}#(ignore:curseforge)
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Bundle - CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/mc-storage-area-network-*-all.jar
          name: Bundle ${{ env.BUNDLED_VER }}
          version: bundled-${{ env.BUNDLED_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      # --- Modrinth: the mod(s) + the bundle (gated by PUBLISH_MODRINTH) -----------
      # `modrinth-id` must be the base62 project ID (not the slug); set the repo
      # variable `MODRINTH_ID`, or grant the token "Read projects".
      - name: Publish API - Modrinth
        if: ${{ (inputs.mod == 'api' || inputs.mod == 'all') && vars.PUBLISH_MODRINTH == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID || 'mc-storage-area-network' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: |
            dist/mc-storage-area-network-*-universal.jar
            dist/api/fabric-mc_storage_area_network-*.jar
            dist/api/neoforge-mc_storage_area_network-*.jar
          name: SAN API ${{ env.API_VER }}
          version: mc-storage-area-network-${{ env.API_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Storage - Modrinth
        if: ${{ (inputs.mod == 'storage' || inputs.mod == 'all') && vars.PUBLISH_MODRINTH == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID || 'mc-storage-area-network' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: dist/storage-network-*.jar
          name: Storage Network ${{ env.STORAGE_VER }}
          version: storage-network-${{ env.STORAGE_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            mc-storage-area-network(required){modrinth:mc-storage-area-network}#(ignore:curseforge)
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Crafting - Modrinth
        if: ${{ (inputs.mod == 'crafting' || inputs.mod == 'all') && vars.PUBLISH_MODRINTH == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID || 'mc-storage-area-network' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: dist/crafting-network-*.jar
          name: Crafting Network ${{ env.CRAFTING_VER }}
          version: crafting-network-${{ env.CRAFTING_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            mc-storage-area-network(required){modrinth:mc-storage-area-network}#(ignore:curseforge)
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Bundle - Modrinth
        if: ${{ vars.PUBLISH_MODRINTH == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID || 'mc-storage-area-network' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: dist/mc-storage-area-network-*-all.jar
          name: Bundle ${{ env.BUNDLED_VER }}
          version: bundled-${{ env.BUNDLED_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn
