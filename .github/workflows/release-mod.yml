name: Release Mod (reusable)

on:
  workflow_call:
    inputs:
      mod:
        description: 'Which mod triggered this release: api | storage | crafting | all'
        required: true
        type: string
      release_tag:
        description: 'Git tag / version for this release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags so the changelog can diff against the previous release.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The committed gradle.properties point at a local Windows JDK; drop that on CI
      # and let the toolchain / JAVA_HOME take over. Also make sure gradlew is executable.
      - name: Prepare build
        run: |
          find . -name gradle.properties -not -path '*/build/*' -exec sed -i '/org.gradle.java.home/d' {} +
          chmod +x ./gradlew

      # A single invocation builds the API, both hosts and every bundle container:
      # `releaseJars` depends on each included build, and `publishRepo` refreshes ./repo.
      - name: Build
        run: ./gradlew --no-daemon clean releaseJars publishRepo

      # build/release/ already carries the final published file names.
      - name: Collect release jars
        run: |
          mkdir -p dist
          cp build/release/*.jar dist/
          ls -la dist

      # Commit-derived changelog used for CurseForge and Modrinth.
      - name: Generate changelog
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          {
            echo "Changes since ${prev:-the beginning}:"
            echo
            git log "$range" --no-merges --pretty=format:'- %s (`%h`)'
            echo
            echo
            echo "Loader-specific builds (Fabric / NeoForge single-loader jars) are published on GitHub:"
            echo "https://github.com/${{ github.repository }}/releases/latest"
          } > dist/changelog.md
          cat dist/changelog.md

      # CurseForge/Modrinth only receive the universal jars; read their versions for entry names.
      - name: Resolve versions
        run: |
          api_ver=$(basename dist/universal_mc_san_api.*.jar | sed -E 's/^universal_mc_san_api\.(.*)\.jar$/\1/')
          bundle_ver=$(basename dist/universal-bundle-all.*.jar | sed -E 's/^universal-bundle-all\.(.*)\.jar$/\1/')
          {
            echo "API_VER=$api_ver"
            echo "BUNDLE_VER=$bundle_ver"
          } >> "$GITHUB_ENV"
          echo "Trigger=${{ inputs.mod }} API=$api_ver Gameplay=$bundle_ver"

      - uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: dist/*.jar

      # --- GitHub release: every jar -------------------------------------------------
      - name: Publish GitHub release
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ inputs.release_tag }}
          github-generate-changelog: true
          files: dist/*.jar
          name: MC Storage Area Network ${{ inputs.release_tag }}
          version: ${{ inputs.release_tag }}
          version-type: release

      # --- CurseForge: 4 universal entries ------------------------------------------
      # The universal API is the primary file of the SAN API entry and the two universal
      # gameplay mods ride along as additional files, so one entry installs the full stack.
      - name: Publish SAN API - CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: |
            dist/universal_mc_san_api.*.jar
            dist/universal-storage-network.*.jar
            dist/universal-crafting-network.*.jar
          name: SAN API ${{ env.API_VER }}
          version: san-api-${{ env.API_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Bundle All - CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/universal-bundle-all.*.jar
          name: Bundle All ${{ env.BUNDLE_VER }}
          version: bundle-all-${{ env.BUNDLE_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Bundle Storage - CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/universal-bundle-storage.*.jar
          name: Bundle Storage ${{ env.BUNDLE_VER }}
          version: bundle-storage-${{ env.BUNDLE_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Bundle Crafting - CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1690770
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/universal-bundle-crafting.*.jar
          name: Bundle Crafting ${{ env.BUNDLE_VER }}
          version: bundle-crafting-${{ env.BUNDLE_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      # --- Modrinth: universal jars, one entry per Modrinth project (gated by PUBLISH_MODRINTH)
      # `modrinth-id` must be the base62 project ID (not the slug); set the repo variables
      # MODRINTH_ID / MODRINTH_STORAGE_ID / MODRINTH_CRAFTING_ID, or grant the token
      # "Read projects". Modrinth projects are per-mod, so the SAN API entry cannot carry
      # the storage/crafting jars the way the single CurseForge project does.
      - name: Publish SAN API - Modrinth
        if: ${{ vars.PUBLISH_MODRINTH == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID || 'mc-storage-area-network' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: dist/universal_mc_san_api.*.jar
          name: SAN API ${{ env.API_VER }}
          version: san-api-${{ env.API_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Storage - Modrinth
        if: ${{ vars.PUBLISH_MODRINTH == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_STORAGE_ID || 'storage-network' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: dist/universal-storage-network.*.jar
          name: Storage Network ${{ env.BUNDLE_VER }}
          version: storage-network-${{ env.BUNDLE_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            mc-storage-area-network(required){modrinth:mc-storage-area-network}#(ignore:curseforge)
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Crafting - Modrinth
        if: ${{ vars.PUBLISH_MODRINTH == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_CRAFTING_ID || 'crafting-network' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: dist/universal-crafting-network.*.jar
          name: Crafting Network ${{ env.BUNDLE_VER }}
          version: crafting-network-${{ env.BUNDLE_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            mc-storage-area-network(required){modrinth:mc-storage-area-network}#(ignore:curseforge)
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Bundle All - Modrinth
        if: ${{ vars.PUBLISH_MODRINTH == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID || 'mc-storage-area-network' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: dist/universal-bundle-all.*.jar
          name: Bundle All ${{ env.BUNDLE_VER }}
          version: bundle-all-${{ env.BUNDLE_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Bundle Storage - Modrinth
        if: ${{ vars.PUBLISH_MODRINTH == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_STORAGE_ID || 'storage-network' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: dist/universal-bundle-storage.*.jar
          name: Bundle Storage ${{ env.BUNDLE_VER }}
          version: bundle-storage-${{ env.BUNDLE_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      - name: Publish Bundle Crafting - Modrinth
        if: ${{ vars.PUBLISH_MODRINTH == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_CRAFTING_ID || 'crafting-network' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: dist/universal-bundle-crafting.*.jar
          name: Bundle Crafting ${{ env.BUNDLE_VER }}
          version: bundle-crafting-${{ env.BUNDLE_VER }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: 1.21.1
          loaders: |
            fabric
            neoforge
          java: 21
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn
