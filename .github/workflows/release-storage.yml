name: Release Storage Network

on:
  push:
    tags:
      - 'storage-v*'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name != 'issue_comment' ||
      contains(github.event.comment.body, '/release-storage')
    uses: ./.github/workflows/release-mod.yml
    with:
      mod: storage
      release_tag: ${{ startsWith(github.ref, 'refs/tags/storage-v') && github.ref_name || format('v{0}', github.run_number) }}
    secrets: inherit
