plugins {
    id 'base'
    id 'maven-publish'
}

apply from: new File(projectDir, 'gradle/versions.gradle')
apply from: new File(projectDir, 'gradle/version-resolver.gradle')

// Which Minecraft version this build targets (directory under versions/). The same selector
// the settings uses, so a single `-Pmc=<version>` drives the whole build.
def mc = providers.gradleProperty('mc').getOrElse('1.21.1')
def versionRoot = "versions/${mc}"

// The API version comes from versions.properties. Each bundle is versioned by the newest stamp
// among the components it contains, so a bundle only changes when something inside it changed.
version = apiVersion
group = 'com.retiredroca.mcstorageareanetwork'

// Each component's maven mod id, which is also the id in its release jar name. Directory names
// differ from the ids (storage-network -> storage_network), so keep one table.
def COMP_ID = [api: 'mc_storage_area_network', storage: 'storage_network',
               crafting: 'crafting_network', routing: 'network_routing',
               access: 'remote_access_terminal']

def componentVersion = { String mod ->
    switch (mod) {
        case 'api': return apiVersion
        case 'storage': return storageVersion
        case 'crafting': return craftingVersion
        case 'routing': return routingVersion
        case 'access': return accessVersion
        default: throw new GradleException("Unknown component: ${mod}")
    }
}
def bundleVersionFor = { List<String> mods ->
    '1.0.0.' + newestStamp(mods.collect { componentVersion(it) })
}

// Exact, version-pinned lookups so a stale jar from an earlier version can never be picked.
def versionedJar = { String path ->
    def f = file(path)
    f.exists() ? f : null
}

// Per-mod, per-loader source jars (lazy so they resolve after the child builds run).
def apiFab = { versionedJar("${versionRoot}/api/fabric/build/libs/${jarFileName(COMP_ID.api, apiVersion, 'fabric')}") }
def apiNeo = { versionedJar("${versionRoot}/api/neoforge/build/libs/${jarFileName(COMP_ID.api, apiVersion, 'neoforge')}") }
def stFab = { versionedJar("${versionRoot}/storage-network/fabric/build/libs/${jarFileName(COMP_ID.storage, storageVersion, 'fabric')}") }
def stNeo = { versionedJar("${versionRoot}/storage-network/neoforge/build/libs/${jarFileName(COMP_ID.storage, storageVersion, 'neoforge')}") }
def crFab = { versionedJar("${versionRoot}/crafting-network/fabric/build/libs/${jarFileName(COMP_ID.crafting, craftingVersion, 'fabric')}") }
def crNeo = { versionedJar("${versionRoot}/crafting-network/neoforge/build/libs/${jarFileName(COMP_ID.crafting, craftingVersion, 'neoforge')}") }
def stUni = { versionedJar("${versionRoot}/storage-network/build/libs/${jarFileName(COMP_ID.storage, storageVersion, 'universal')}") }
def crUni = { versionedJar("${versionRoot}/crafting-network/build/libs/${jarFileName(COMP_ID.crafting, craftingVersion, 'universal')}") }
def rtFab = { versionedJar("${versionRoot}/network-routing/fabric/build/libs/${jarFileName(COMP_ID.routing, routingVersion, 'fabric')}") }
def rtNeo = { versionedJar("${versionRoot}/network-routing/neoforge/build/libs/${jarFileName(COMP_ID.routing, routingVersion, 'neoforge')}") }
def rtUni = { versionedJar("${versionRoot}/network-routing/build/libs/${jarFileName(COMP_ID.routing, routingVersion, 'universal')}") }
def acFab = { versionedJar("${versionRoot}/remote-access-terminal/fabric/build/libs/${jarFileName(COMP_ID.access, accessVersion, 'fabric')}") }
def acNeo = { versionedJar("${versionRoot}/remote-access-terminal/neoforge/build/libs/${jarFileName(COMP_ID.access, accessVersion, 'neoforge')}") }
def acUni = { versionedJar("${versionRoot}/remote-access-terminal/build/libs/${jarFileName(COMP_ID.access, accessVersion, 'universal')}") }

def fabJar = [api: apiFab, storage: stFab, crafting: crFab, routing: rtFab, access: acFab]
def neoJar = [api: apiNeo, storage: stNeo, crafting: crNeo, routing: rtNeo, access: acNeo]
def fabName = [api: 'mc_storage_area_network-fabric.jar',
               storage: 'storage-network-fabric.jar',
               crafting: 'crafting-network-fabric.jar',
               routing: 'network-routing-fabric.jar',
               access: 'remote-access-terminal-fabric.jar']
def neoName = [api: 'mc_storage_area_network-neoforge.jar',
               storage: 'storage-network-neoforge.jar',
               crafting: 'crafting-network-neoforge.jar',
               routing: 'network-routing-neoforge.jar',
               access: 'remote-access-terminal-neoforge.jar']

def staticTokens = [
        '@@AUTHORS@@'          : 'Retired Roca',
        '@@LICENSE@@'          : 'Apache-2.0',
        '@@MC_VERSION@@'       : mc,
        '@@MC_VERSION_RANGE@@' : mc,
]
def apiTokens = staticTokens + ['@@VERSION@@': apiVersion]
// The version each component is built at, straight from versions.properties. This used to be
// recovered by parsing the built jar's filename, which meant a rename to the naming scheme broke
// the bundle templates at build time, and the parse was the only thing tying a template's declared
// dependency version to a file name. The versions are already variables, so use them.
def versionTokens = {
    [
            '@@API_VERSION@@'     : apiVersion,
            '@@STORAGE_VERSION@@' : storageVersion,
            '@@CRAFTING_VERSION@@': craftingVersion,
            '@@ROUTING_VERSION@@' : routingVersion,
            '@@ACCESS_VERSION@@'  : accessVersion,
    ]
}

// --- repo/ maven housekeeping -------------------------------------------------------
def versionKey = { String v -> v.tokenize('.').collect { it.isInteger() ? it.toInteger() : 0 } }
def compareVersions = { String a, String b ->
    def ka = versionKey(a)
    def kb = versionKey(b)
    for (int i = 0; i < Math.max(ka.size(), kb.size()); i++) {
        def x = i < ka.size() ? ka[i] : 0
        def y = i < kb.size() ? kb[i] : 0
        if (x != y) {
            return x <=> y
        }
    }
    0
}
def writeChecksums = { File f ->
    def bytes = f.bytes
    ['md5': 'MD5', 'sha1': 'SHA-1', 'sha256': 'SHA-256', 'sha512': 'SHA-512'].each { ext, algo ->
        def digest = java.security.MessageDigest.getInstance(algo).digest(bytes)
        new File(f.parentFile, "${f.name}.${ext}").text =
                digest.collect { String.format('%02x', it & 0xff) }.join()
    }
}
def writeMetadata = { File artifactDir, String groupId, String artifactId, List<String> versions ->
    def sorted = versions.sort { a, b -> compareVersions(a, b) }
    def latest = sorted.last()
    def xml = new StringBuilder()
    xml << '<?xml version="1.0" encoding="UTF-8"?>\n'
    xml << '<metadata>\n'
    xml << "  <groupId>${groupId}</groupId>\n"
    xml << "  <artifactId>${artifactId}</artifactId>\n"
    xml << '  <versioning>\n'
    xml << "    <latest>${latest}</latest>\n"
    xml << "    <release>${latest}</release>\n"
    xml << '    <versions>\n'
    sorted.each { v -> xml << "      <version>${v}</version>\n" }
    xml << '    </versions>\n'
    xml << "    <lastUpdated>${new java.text.SimpleDateFormat('yyyyMMddHHmmss').format(new Date())}</lastUpdated>\n"
    xml << '  </versioning>\n'
    xml << '</metadata>\n'
    def meta = new File(artifactDir, 'maven-metadata.xml')
    meta.text = xml.toString()
    writeChecksums(meta)
}

// Included-build name for each gameplay mod. The API's two loader builds are top-level included
// builds named `fabric` / `neoforge`; every other mod is a composite build that exposes thin
// `:buildFabric` / `:buildNeo` aliases so a parent build can request one loader half on its own.
def modBuild = [storage: 'storage-network',
                crafting: 'crafting-network',
                routing: 'network-routing',
                access: 'remote-access-terminal']

// Build exactly one loader half of a component.
def dependOnLoader = { org.gradle.api.Task t, String mod, String loader ->
    if (mod == 'api') {
        t.dependsOn gradle.includedBuild(loader).task(':build')
    } else {
        t.dependsOn gradle.includedBuild(modBuild[mod]).task(loader == 'fabric' ? ':buildFabric' : ':buildNeo')
    }
}

// Build the universal (both-loaders-merged) artifact of a component.
def dependOnUniversal = { org.gradle.api.Task t, String mod ->
    if (mod == 'api') {
        t.dependsOn gradle.includedBuild('fabric').task(':build')
        t.dependsOn gradle.includedBuild('neoforge').task(':build')
    } else {
        t.dependsOn gradle.includedBuild(modBuild[mod]).task(':universalJar')
    }
}

// Optional single-loader restriction for the loader stages: -Ploader=fabric|neoforge. Unset builds
// both loaders. The universal stages always merge both, so they ignore it.
def loaderFilter = (findProperty('loader') ?: '').toString().toLowerCase()
if (loaderFilter && loaderFilter != 'fabric' && loaderFilter != 'neoforge') {
    throw new GradleException("Invalid -Ploader='${loaderFilter}' (expected 'fabric' or 'neoforge')")
}
def activeLoaders = loaderFilter ? [loaderFilter] : ['fabric', 'neoforge']

// --- API freshness -------------------------------------------------------------------
// Hosts resolve the API from repo/, but Loom caches its remapped copy: editing API sources
// without a version bump would leave them compiling against the stale cache. Fingerprint the API
// sources and, only when that changes, republish the API and drop the dependents' remapped API
// artifacts. An unchanged API leaves normal builds untouched (the task stays up-to-date).
def apiSrcTree = fileTree("${versionRoot}/api") {
    include '**/src/**'
}
def apiFingerprintFile = layout.buildDirectory.file('api-fingerprint.txt')
def apiFingerprintDigest = { ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    def base = projectDir.absolutePath
    apiSrcTree.files.findAll { it.isFile() }.sort { it.path }.each { File f ->
        digest.update(f.absolutePath.substring(base.length()).replace('\\', '/').getBytes('UTF-8'))
        digest.update(f.bytes)
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}
def apiFingerprintNow = apiFingerprintDigest()
def apiFingerprintStored = {
    def f = apiFingerprintFile.get().asFile
    f.exists() ? f.text.trim() : ''
}()
def apiChanged = apiFingerprintNow != apiFingerprintStored

tasks.register('ensureApi') {
    group = 'build'
    description = 'Republishes the API and clears dependent Loom caches when the API sources changed.'
    inputs.files(apiSrcTree)
    outputs.file(apiFingerprintFile)
    if (apiChanged) {
        dependsOn gradle.includedBuild('fabric').task(':publishMavenJavaPublicationToRepoRepository')
        dependsOn gradle.includedBuild('neoforge').task(':publishMavenJavaPublicationToRepoRepository')
    }
    doLast {
        if (!apiChanged) {
            return
        }
        def removed = 0
        file(versionRoot).listFiles()?.findAll { it.isDirectory() }?.each { modDir ->
            ['fabric', 'neoforge'].each { loader ->
                def remapped = new File(modDir, "${loader}/.gradle/loom-cache/remapped_mods")
                if (!remapped.isDirectory()) {
                    return
                }
                def stale = []
                remapped.eachFileRecurse { f ->
                    if (f.path.replace('\\', '/').contains('mc_storage_area_network')) {
                        stale << f
                    }
                }
                // Deepest first so files are removed before the directories that hold them.
                stale.sort { a, b -> b.path.length() <=> a.path.length() }.each { f ->
                    if (f.exists() && f.delete()) {
                        removed++
                    }
                }
            }
        }
        apiFingerprintFile.get().asFile.text = apiFingerprintNow
        logger.lifecycle("ensureApi: API republished and dependents de-cached (${apiFingerprintNow}, ${removed} stale entries)")
    }
}

/**
 * Universal API bundle: thin container nesting the loader-specific API jars so each loader loads
 * only its own copy of the public com.retiredroca.mcstorageareanetwork.api package.
 */
tasks.register('apiUniversalJar', Jar) {
    dependOnUniversal(delegate, 'api')
    archiveFileName = jarFileName(COMP_ID.api, apiVersion, 'universal')
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from('bundler/bundle') {
        filter { String line ->
            def out = line
            apiTokens.each { token, value -> out = out.replace(token, value) }
            out
        }
    }
    from({ def f = apiFab(); f == null ? [] : f }) {
        into 'META-INF/jars'
        rename { 'mc_storage_area_network-fabric.jar' }
    }
    from({ def f = apiNeo(); f == null ? [] : f }) {
        into 'META-INF/jarjar'
        rename { 'mc_storage_area_network-neoforge.jar' }
    }
}

/**
 * Bundle container. `fabMods` are nested under META-INF/jars (Fabric), `neoMods` under
 * META-INF/jarjar (NeoForge); one jar can only carry one mod per loader, hence the container.
 */
// `kind` and `bundleKey` replace the old compound artifactPrefix (e.g. "universal-bundle-all"),
// so the archive name comes from jarFileName like every other release artifact.
def registerBundle = { String taskName, String templateDir, String kind, String bundleKey, String bundleVersion, List fabMods, List neoMods ->
    def t = tasks.register(taskName, Jar) {
        def staged = delegate
        fabMods.each { m -> dependOnLoader(staged, m, 'fabric') }
        neoMods.each { m -> dependOnLoader(staged, m, 'neoforge') }
        archiveFileName = jarFileName("bundle-${bundleKey}", bundleVersion, kind)
        destinationDirectory = layout.buildDirectory.dir('libs')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        from(templateDir) {
            filter { String line ->
                def out = line
                (['@@VERSION@@': bundleVersion] + staticTokens + versionTokens()).each { token, value ->
                    out = out.replace(token, value)
                }
                out
            }
        }
        fabMods.each { m ->
            from({ def f = fabJar[m](); f == null ? [] : f }) {
                into 'META-INF/jars'
                rename { fabName[m] }
            }
        }
        neoMods.each { m ->
            from({ def f = neoJar[m](); f == null ? [] : f }) {
                into 'META-INF/jarjar'
                rename { neoName[m] }
            }
        }
    }
    return t
}

def apiMods = ['api']
def storageMods = ['api', 'storage']
def craftingMods = ['api', 'crafting']
def routingMods = ['api', 'storage', 'routing']
def accessMods = ['api', 'access']
def allMods = ['api', 'storage', 'crafting', 'routing', 'access']

def allBundleVersion = bundleVersionFor(allMods)
def storageBundleVersion = bundleVersionFor(storageMods)
def craftingBundleVersion = bundleVersionFor(craftingMods)
def routingBundleVersion = bundleVersionFor(routingMods)
def accessBundleVersion = bundleVersionFor(accessMods)

registerBundle('bundleAllJar', 'bundler/bundle-all', 'universal', 'all', allBundleVersion, allMods, allMods)
registerBundle('bundleStorageJar', 'bundler/bundle-storage', 'universal', 'storage', storageBundleVersion, storageMods, storageMods)
registerBundle('bundleCraftingJar', 'bundler/bundle-crafting', 'universal', 'crafting', craftingBundleVersion, craftingMods, craftingMods)
registerBundle('bundleRoutingJar', 'bundler/bundle-routing', 'universal', 'routing', routingBundleVersion, routingMods, routingMods)
registerBundle('bundleAccessJar', 'bundler/bundle-access', 'universal', 'access', accessBundleVersion, accessMods, accessMods)

registerBundle('fabricBundleAllJar', 'bundler/bundle-all-fabric', 'fabric', 'all', allBundleVersion, allMods, [])
registerBundle('fabricBundleStorageJar', 'bundler/bundle-storage-fabric', 'fabric', 'storage', storageBundleVersion, storageMods, [])
registerBundle('fabricBundleCraftingJar', 'bundler/bundle-crafting-fabric', 'fabric', 'crafting', craftingBundleVersion, craftingMods, [])
registerBundle('fabricBundleRoutingJar', 'bundler/bundle-routing-fabric', 'fabric', 'routing', routingBundleVersion, routingMods, [])
registerBundle('fabricBundleAccessJar', 'bundler/bundle-access-fabric', 'fabric', 'access', accessBundleVersion, accessMods, [])

registerBundle('neoforgeBundleAllJar', 'bundler/bundle-all-neoforge', 'neoforge', 'all', allBundleVersion, [], allMods)
registerBundle('neoforgeBundleStorageJar', 'bundler/bundle-storage-neoforge', 'neoforge', 'storage', storageBundleVersion, [], storageMods)
registerBundle('neoforgeBundleCraftingJar', 'bundler/bundle-crafting-neoforge', 'neoforge', 'crafting', craftingBundleVersion, [], craftingMods)
registerBundle('neoforgeBundleRoutingJar', 'bundler/bundle-routing-neoforge', 'neoforge', 'routing', routingBundleVersion, [], routingMods)
registerBundle('neoforgeBundleAccessJar', 'bundler/bundle-access-neoforge', 'neoforge', 'access', accessBundleVersion, [], accessMods)

/**
 * The release is built in four ordered stages so a failure points at the layer that broke and a
 * single loader (or just the universal layer) can be rebuilt without pulling in everything:
 *   1. releaseLoaderJars        per-loader API jars + per-loader gameplay mod jars
 *   2. releaseLoaderBundles     the per-loader bundle containers
 *   3. releaseUniversal         the API universal container + universal gameplay mod jars
 *   4. releaseUniversalBundles  the universal bundle containers
 * `releaseJars` unions all four into build/release/ so a release always yields the full set.
 */
tasks.register('releaseLoaderJars', Sync) {
    def staged = delegate
    group = 'release'
    description = 'Stage the per-loader API and gameplay mod jars (build/release-loader).'
    into layout.buildDirectory.dir('release-loader')

    if (activeLoaders.contains('fabric')) {
        ['api', 'storage', 'crafting', 'routing', 'access'].each { m -> dependOnLoader(staged, m, 'fabric') }
        from({ def f = apiFab(); f == null ? [] : f }) { rename { jarFileName(COMP_ID.api, apiVersion, 'fabric') } }
        from({ def f = stFab(); f == null ? [] : f }) { rename { jarFileName(COMP_ID.storage, storageVersion, 'fabric') } }
        from({ def f = crFab(); f == null ? [] : f }) { rename { jarFileName(COMP_ID.crafting, craftingVersion, 'fabric') } }
        from({ def f = rtFab(); f == null ? [] : f }) { rename { jarFileName(COMP_ID.routing, routingVersion, 'fabric') } }
        from({ def f = acFab(); f == null ? [] : f }) { rename { jarFileName(COMP_ID.access, accessVersion, 'fabric') } }
    }
    if (activeLoaders.contains('neoforge')) {
        ['api', 'storage', 'crafting', 'routing', 'access'].each { m -> dependOnLoader(staged, m, 'neoforge') }
        from({ def f = apiNeo(); f == null ? [] : f }) { rename { jarFileName(COMP_ID.api, apiVersion, 'neoforge') } }
        from({ def f = stNeo(); f == null ? [] : f }) { rename { jarFileName(COMP_ID.storage, storageVersion, 'neoforge') } }
        from({ def f = crNeo(); f == null ? [] : f }) { rename { jarFileName(COMP_ID.crafting, craftingVersion, 'neoforge') } }
        from({ def f = rtNeo(); f == null ? [] : f }) { rename { jarFileName(COMP_ID.routing, routingVersion, 'neoforge') } }
        from({ def f = acNeo(); f == null ? [] : f }) { rename { jarFileName(COMP_ID.access, accessVersion, 'neoforge') } }
    }
}

tasks.register('releaseLoaderBundles', Sync) {
    group = 'release'
    description = 'Stage the per-loader bundle containers (build/release-loader-bundles).'
    into layout.buildDirectory.dir('release-loader-bundles')

    if (activeLoaders.contains('fabric')) {
        dependsOn 'fabricBundleAllJar', 'fabricBundleStorageJar', 'fabricBundleCraftingJar',
                'fabricBundleRoutingJar', 'fabricBundleAccessJar'
        from(tasks.named('fabricBundleAllJar'), tasks.named('fabricBundleStorageJar'),
                tasks.named('fabricBundleCraftingJar'), tasks.named('fabricBundleRoutingJar'),
                tasks.named('fabricBundleAccessJar'))
    }
    if (activeLoaders.contains('neoforge')) {
        dependsOn 'neoforgeBundleAllJar', 'neoforgeBundleStorageJar', 'neoforgeBundleCraftingJar',
                'neoforgeBundleRoutingJar', 'neoforgeBundleAccessJar'
        from(tasks.named('neoforgeBundleAllJar'), tasks.named('neoforgeBundleStorageJar'),
                tasks.named('neoforgeBundleCraftingJar'), tasks.named('neoforgeBundleRoutingJar'),
                tasks.named('neoforgeBundleAccessJar'))
    }
}

tasks.register('releaseUniversal', Sync) {
    def staged = delegate
    group = 'release'
    description = 'Stage the universal API container and universal gameplay mod jars (build/release-universal).'
    into layout.buildDirectory.dir('release-universal')

    dependsOn 'apiUniversalJar'
    ['storage', 'crafting', 'routing', 'access'].each { m -> dependOnUniversal(staged, m) }

    from(tasks.named('apiUniversalJar'))
    from({ def f = stUni(); f == null ? [] : f }) { rename { jarFileName(COMP_ID.storage, storageVersion, 'universal') } }
    from({ def f = crUni(); f == null ? [] : f }) { rename { jarFileName(COMP_ID.crafting, craftingVersion, 'universal') } }
    from({ def f = rtUni(); f == null ? [] : f }) { rename { jarFileName(COMP_ID.routing, routingVersion, 'universal') } }
    from({ def f = acUni(); f == null ? [] : f }) { rename { jarFileName(COMP_ID.access, accessVersion, 'universal') } }
}

tasks.register('releaseUniversalBundles', Sync) {
    group = 'release'
    description = 'Stage the universal bundle containers (build/release-universal-bundles).'
    into layout.buildDirectory.dir('release-universal-bundles')

    dependsOn 'bundleAllJar', 'bundleStorageJar', 'bundleCraftingJar', 'bundleRoutingJar', 'bundleAccessJar'
    from(tasks.named('bundleAllJar'), tasks.named('bundleStorageJar'), tasks.named('bundleCraftingJar'),
            tasks.named('bundleRoutingJar'), tasks.named('bundleAccessJar'))
}

// The stages run in order; a filtered loader stage still comes first.
tasks.named('releaseLoaderBundles') { mustRunAfter 'releaseLoaderJars' }
tasks.named('releaseUniversal') { mustRunAfter 'releaseLoaderBundles' }
tasks.named('releaseUniversalBundles') { mustRunAfter 'releaseUniversal' }

// An API change must reach the hosts first (republish + de-cache before they compile).
['releaseLoaderJars', 'releaseLoaderBundles', 'releaseUniversal', 'releaseUniversalBundles'].each { n ->
    tasks.named(n) { dependsOn 'ensureApi' }
}

/**
 * Collects every release jar under build/release/ from the four staged dirs. Still the union, so a
 * release always yields the complete set regardless of how the individual stages were invoked.
 */
tasks.register('releaseJars', Sync) {
    group = 'release'
    description = 'Assemble the complete release jar set into build/release from the four stages.'
    dependsOn 'ensureApi'
    dependsOn 'releaseLoaderJars', 'releaseLoaderBundles', 'releaseUniversal', 'releaseUniversalBundles'
    into layout.buildDirectory.dir('release')

    // Fail loudly if any version-pinned component jar is missing, rather than silently
    // assembling a bundle without it.
    doFirst {
        def expected = [apiFab(), apiNeo(), stFab(), stNeo(), crFab(), crNeo(), stUni(), crUni(), rtFab(), rtNeo(),
                        rtUni(), acFab(), acNeo(), acUni()]
        if (expected.any { it == null }) {
            throw new GradleException('releaseJars: a component jar is missing; did every included build run?')
        }
    }

    // The staged dirs hold the renamed jars, so the union is a straight copy of their outputs.
    from(tasks.named('releaseLoaderJars'), tasks.named('releaseLoaderBundles'),
            tasks.named('releaseUniversal'), tasks.named('releaseUniversalBundles'))
}

// Targeted rebuilds: wipe just the loader or the universal stage outputs.
tasks.register('cleanLoader', Delete) {
    group = 'build'
    description = 'Deletes the loader stage output dirs so they are rebuilt from scratch.'
    delete layout.buildDirectory.dir('release-loader'), layout.buildDirectory.dir('release-loader-bundles')
}

tasks.register('cleanUniversal', Delete) {
    group = 'build'
    description = 'Deletes the universal stage output dirs so they are rebuilt from scratch.'
    delete layout.buildDirectory.dir('release-universal'), layout.buildDirectory.dir('release-universal-bundles')
}

tasks.named('build') {
    dependsOn 'releaseJars'
}

// Cleaning at the root cleans every included build too, so no stale jar of an older version
// can survive a release build.
tasks.named('clean') {
    dependsOn gradle.includedBuild('fabric').task(':clean')
    dependsOn gradle.includedBuild('neoforge').task(':clean')
    dependsOn gradle.includedBuild('storage-network').task(':clean')
    dependsOn gradle.includedBuild('crafting-network').task(':clean')
    dependsOn gradle.includedBuild('network-routing').task(':clean')
    dependsOn gradle.includedBuild('remote-access-terminal').task(':clean')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(tasks.named('apiUniversalJar'))
            artifactId = "mc-storage-area-network-${mc}"
        }
    }
    repositories {
        maven {
            name = 'repo'
            url = uri("${projectDir}/repo")
        }
        mavenLocal()
    }
}

// Publishes the per-loader API jars to mavenLocal (for local host builds).
tasks.register('publishApi') {
    group = 'publishing'
    description = 'Publishes the Fabric and NeoForge API jars to mavenLocal for host mods to consume.'
    dependsOn gradle.includedBuild('fabric').task(':publishToMavenLocal')
    dependsOn gradle.includedBuild('neoforge').task(':publishToMavenLocal')
}

// Publishes everything (per-loader jars + universal bundle) into the in-repo maven (repo/).
tasks.register('publishRepo') {
    group = 'publishing'
    description = 'Publishes the API (per-loader jars + universal bundle) into ./repo for hosts and modders.'
    dependsOn gradle.includedBuild('fabric').task(':publishMavenJavaPublicationToRepoRepository')
    dependsOn gradle.includedBuild('neoforge').task(':publishMavenJavaPublicationToRepoRepository')
    dependsOn 'publishMavenJavaPublicationToRepoRepository'
    finalizedBy 'pruneRepo'
}

// Keeps the in-repo maven small: newest 3 versions per artifact, with matching metadata.
tasks.register('pruneRepo') {
    group = 'publishing'
    description = 'Keeps only the newest 3 versions of each artifact in ./repo and refreshes maven-metadata.'
    doLast {
        def keep = 3
        def groupRoot = file('repo/com/retiredroca')
        if (!groupRoot.exists()) {
            return
        }
        groupRoot.eachDir { groupDir ->
            groupDir.eachDir { artifactDir ->
                def versionDirs = artifactDir.listFiles().findAll { it.isDirectory() }
                if (versionDirs.isEmpty()) {
                    return
                }
                versionDirs.sort { a, b -> compareVersions(a.name, b.name) }
                if (versionDirs.size() > keep) {
                    def dropCount = versionDirs.size() - keep
                    versionDirs[0..<dropCount].each { it.deleteDir() }
                    versionDirs = versionDirs[dropCount..-1]
                }
                // Always refresh metadata from the directories that actually exist, so removing a
                // version out-of-band (e.g. migrating the version scheme) can't leave stale entries
                // that break dynamic/range resolution.
                def kept = versionDirs.collect { it.name }
                writeMetadata(artifactDir, "com.retiredroca.${groupDir.name}", artifactDir.name, kept)
                logger.lifecycle("pruneRepo: ${artifactDir.name} kept ${kept.join(', ')}")
            }
        }
    }
}
