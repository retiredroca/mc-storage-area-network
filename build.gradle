plugins {
    id 'base'
    id 'maven-publish'
}

// Fixed API version (no build-date suffix).
version = '1.0.2'
group = 'com.retiredroca.mcstorageareanetwork'

// Newest non-sources / non-dev jar in a directory.
def newestJar = { String dir ->
    def d = file(dir)
    def jars = (d.listFiles() ?: new File[0]).findAll {
        it.name.endsWith('.jar') && !it.name.contains('sources') && !it.name.contains('dev')
    }
    if (jars.isEmpty()) {
        return null
    }
    jars.sort { it.lastModified() }
    return jars.last()
}

def bundleTokens = [
        '@@VERSION@@': version.toString(),
        '@@AUTHORS@@': 'Retired Roca',
        '@@LICENSE@@': 'Apache-2.0',
]

/**
 * Universal bundle: a thin container mod holding the loader-specific API jars as nested mods.
 * The container carries no top-level classes, so each loader loads only its own nested copy of the
 * public com.retiredroca.mcstorageareanetwork.api package (Fabric intermediary vs NeoForge Mojang).
 */
tasks.register('universalJar', Jar) {
    dependsOn gradle.includedBuild('fabric').task(':build')
    dependsOn gradle.includedBuild('neoforge').task(':build')

    archiveBaseName = 'mc-storage-area-network'
    archiveClassifier = 'universal'
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Container metadata only (fabric.mod.json + META-INF/neoforge.mods.toml + jarjar metadata).
    from('bundle') {
        filter { String line ->
            def out = line
            bundleTokens.each { token, value -> out = out.replace(token, value) }
            out
        }
    }
    from({ newestJar('fabric/build/libs') }) {
        into 'META-INF/jars'
        rename { 'mc_storage_area_network-fabric.jar' }
    }
    from({ newestJar('neoforge/build/libs') }) {
        into 'META-INF/jarjar'
        rename { 'mc_storage_area_network-neoforge.jar' }
    }
}

tasks.named('build') {
    dependsOn 'universalJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(tasks.named('universalJar'))
            artifactId = 'mc-storage-area-network'
        }
    }
    repositories {
        maven {
            name = 'repo'
            url = uri("${projectDir}/repo")
        }
        mavenLocal()
    }
}

// Publishes the per-loader API jars to mavenLocal (for local host builds).
tasks.register('publishApi') {
    group = 'publishing'
    description = 'Publishes the Fabric and NeoForge API jars to mavenLocal for host mods to consume.'
    dependsOn gradle.includedBuild('fabric').task(':publishToMavenLocal')
    dependsOn gradle.includedBuild('neoforge').task(':publishToMavenLocal')
}

// Publishes everything (per-loader jars + universal bundle) into the in-repo maven (repo/).
tasks.register('publishRepo') {
    group = 'publishing'
    description = 'Publishes the API (per-loader jars + universal bundle) into ./repo for hosts and modders.'
    dependsOn gradle.includedBuild('fabric').task(':publishMavenJavaPublicationToRepoRepository')
    dependsOn gradle.includedBuild('neoforge').task(':publishMavenJavaPublicationToRepoRepository')
    dependsOn 'publishMavenJavaPublicationToRepoRepository'
}
