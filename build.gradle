plugins {
    id 'base'
    id 'maven-publish'
}

apply from: new File(projectDir, 'gradle/versions.gradle')
apply from: new File(projectDir, 'gradle/version-resolver.gradle')

// Which Minecraft version this build targets (directory under versions/). The same selector
// the settings uses, so a single `-Pmc=<version>` drives the whole build.
def mc = providers.gradleProperty('mc').getOrElse('1.21.1')
def versionRoot = "versions/${mc}"

// Module discovery lives in gradle/versions.gradle (moduleProps: id -> the module's
// module.properties, moduleDirById: id -> its directory) because the loader builds need it too, to
// resolve a dependency's group and floor. One scan in one place: the root build and every module
// build resolve module identity the same way, so they cannot disagree about which modules exist.
def moduleIds = moduleProps.keySet().sort() as List
def loadModule = { String id -> moduleProps[id] }

// A module's version is its versions.properties entry, so the id is all a caller ever needs. The
// id used to be a hand-written table keyed by a separate short name, with the directory name as a
// third spelling of the same thing; the id is now declared once, in module.properties, and is
// simultaneously the versions.properties key, the release jar name, the maven artifactId and the
// assets/data namespace.
def moduleVersion = { String id -> stampVersion(componentVersions.getProperty(id)) }

// The library is the release line: the tag is keyed on its version, and it is the one module
// published to the in-repo maven for the others to build against. Found by module.properties'
// library=true rather than by a hardcoded id.
def libraryId = moduleProps.values().find { (it.getProperty('library') ?: 'false').toBoolean() }?.getProperty('id')
if (libraryId == null) {
    throw new GradleException("No module under ${versionRoot}/ declares library=true in module.properties (modules: ${moduleIds})")
}

// A module's two shapes, read off the disk rather than from a table of names. A composite module is
// its own build root and exposes :buildFabric / :buildNeo / :universalJar; a split one (the API) has
// no root of its own, so its loader halves are included by the root build under <dir>-<loader>.
def isComposite = { String id -> new File(moduleDirById[id], 'settings.gradle').exists() }
def moduleBuildName = { String id, String loader ->
    isComposite(id) ? moduleDirById[id].name : "${moduleDirById[id].name}-${loader}"
}
def moduleBuildTask = { String id, String loader ->
    isComposite(id) ? (loader == 'fabric' ? ':buildFabric' : ':buildNeo') : ':build'
}

version = moduleVersion(libraryId)
group = loadModule(libraryId).getProperty('group')

// Bundles are declared in bundles.properties: bundle.<name>=<ids>, plus a display title and a
// one-line description. The same file is read by the release tooling to decide which bundles a
// release changed and how many jars to expect, so membership exists once. The version is the highest
// among the members, so a bundle's major.minor.patch tracks its own contents: raising the library to
// 1.0.3 raises bundle-all to 1.0.3. It used to be a hardcoded '1.0.0.' plus the newest stamp found
// inside, which held the numbers still and moved only when the stamp did.
//
// A bundle's container metadata is generated from this, not read from a template directory. It used
// to be 16 hand-written directories under bundler/, where each bundle's member list appeared five
// times over (fabric.mod.json jars, jarjar metadata.json paths, jarjar identifiers, and the nested
// jar names themselves) and every one of them had to be edited by hand when a module was renamed.
def bundleDefs = [:]
def bundlesFile = file('bundles.properties')
if (bundlesFile.exists()) {
    def bundleProps = new Properties()
    bundlesFile.withInputStream { bundleProps.load(it) }
    bundleProps.stringPropertyNames().findAll { it ==~ /bundle\.[^.]+$/ }.sort().each { key ->
        def name = key.substring('bundle.'.length())
        def ids = bundleProps.getProperty(key).tokenize(',').collect { it.trim() }.findAll { it }
        if (ids.isEmpty()) {
            return
        }
        def missing = ids.findAll { !moduleDirById.containsKey(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("bundles.properties: bundle '${name}' references unknown module(s): ${missing}")
        }
        bundleDefs[name] = [
                ids    : ids,
                title  : bundleProps.getProperty("bundle.${name}.title") ?: name.capitalize(),
                blurb  : bundleProps.getProperty("bundle.${name}.description")
                        ?: "One-file install: ${ids.collect { loadModule(it).getProperty('name') }.join(', ')}.",
        ]
    }
}
def bundleVersionFor = { List<String> ids -> maxVersion(ids.collect { moduleVersion(it) }) }

// Exact, version-pinned lookups so a stale jar from an earlier version can never be picked.
def versionedJar = { String path ->
    def f = file(path)
    f.exists() ? f : null
}

// Per-mod, per-loader source jars (lazy so they resolve after the child builds run). One lookup
// per (id, loader) instead of a named closure per module: a new module needs no line here.
def perLoaderJar = { String id, String loader ->
    def dir = moduleDirById[id]
    versionedJar("${versionRoot}/${dir.name}/${loader}/build/libs/${jarFileName(id, moduleVersion(id), loader)}")
}
// The merged universal jar lives in a composite module's own build/libs; a split module has no root
// of its own, so the root build merges it (see libraryUniversalJar below).
def perUniversalJar = { String id ->
    isComposite(id)
            ? versionedJar("${versionRoot}/${moduleDirById[id].name}/build/libs/${jarFileName(id, moduleVersion(id), 'universal')}")
            : null
}

// The name a module's jar takes inside a bundle: exactly the name it has as a release artifact, so
// a nested jar and the standalone jar of the same mod are the same file name. It used to be the
// directory name plus a loader suffix (storage-network-fabric.jar, for a module whose id is
// storage_network) with no version, which is the same module wearing a second, different name inside
// one archive -- and with duplicatesStrategy = EXCLUDE, two members colliding on that name would
// have been silently dropped from the bundle. Distinct members now differ by id and version, so that
// cannot happen.
def nestedName = { String id, String loader -> jarFileName(id, moduleVersion(id), loader) }

// Where a module's jar sits inside a bundle, per loader. Fabric reads META-INF/jars, NeoForge
// JarJar reads META-INF/jarjar, and both resolve the nested jar by this path.
def nestedPath = { String id, String loader -> "META-INF/${loader == 'fabric' ? 'jars' : 'jarjar'}/${nestedName(id, loader)}" }
def nestedDir = { String loader -> loader == 'fabric' ? 'META-INF/jars' : 'META-INF/jarjar' }

// The display name of a bundle's own mod entry, and its description. Both are derived from
// bundles.properties so the three containers of one bundle cannot disagree about what it is.
def bundleModId = { String name, String loader -> "mc_storage_area_network_bundle_${name}${loader == 'universal' ? '' : '_' + loader}" }
def bundleDisplayName = { String name, String loader ->
    def t = loadModule(libraryId).getProperty('name').replace(' API', '')
    loader == 'universal' ? "${t} (${bundleDefs[name].title})" : "${t} (${bundleDefs[name].title}) (${loader == 'fabric' ? 'Fabric' : 'NeoForge'})"
}
def bundleDescription = { String name, String loader ->
    def how = loader == 'universal' ? 'both loaders' : (loader == 'fabric' ? 'Fabric' : 'NeoForge')
    "${bundleDefs[name].blurb} Works on ${how}; each loader loads only its own nested jars."
}

// A bundle's own licence and authors come from its first member's module.properties rather than
// from a template, so a bundle cannot claim a licence its nested jars do not carry.

// --- repo/ maven housekeeping -------------------------------------------------------
def writeChecksums = { File f ->
    def bytes = f.bytes
    ['md5': 'MD5', 'sha1': 'SHA-1', 'sha256': 'SHA-256', 'sha512': 'SHA-512'].each { ext, algo ->
        def digest = java.security.MessageDigest.getInstance(algo).digest(bytes)
        new File(f.parentFile, "${f.name}.${ext}").text =
                digest.collect { String.format('%02x', it & 0xff) }.join()
    }
}
def writeMetadata = { File artifactDir, String groupId, String artifactId, List<String> versions ->
    def sorted = new ArrayList(versions).sort { a, b -> compareVersions(a, b) }
    def latest = sorted.last()
    def xml = new StringBuilder()
    xml << '<?xml version="1.0" encoding="UTF-8"?>\n'
    xml << '<metadata>\n'
    xml << "  <groupId>${groupId}</groupId>\n"
    xml << "  <artifactId>${artifactId}</artifactId>\n"
    xml << '  <versioning>\n'
    xml << "    <latest>${latest}</latest>\n"
    xml << "    <release>${latest}</release>\n"
    xml << '    <versions>\n'
    sorted.each { v -> xml << "      <version>${v}</version>\n" }
    xml << '    </versions>\n'
    xml << "    <lastUpdated>${new java.text.SimpleDateFormat('yyyyMMddHHmmss').format(new Date())}</lastUpdated>\n"
    xml << '  </versioning>\n'
    xml << '</metadata>\n'
    def meta = new File(artifactDir, 'maven-metadata.xml')
    meta.text = xml.toString()
    writeChecksums(meta)
}

// Build exactly one loader half of a module. Both shapes resolve through moduleBuildName /
// moduleBuildTask, which read the module's own layout, so there is no table of which module is which
// shape -- the old one had a row per gameplay mod plus an `if (mod == 'api')` in both closures.
def dependOnLoader = { org.gradle.api.Task t, String id, String loader ->
    t.dependsOn gradle.includedBuild(moduleBuildName(id, loader)).task(moduleBuildTask(id, loader))
}

// Build the universal (both-loaders-merged) artifact of a module. A composite module builds it
// itself; a split one has no root of its own, so both its loader halves are built instead.
def dependOnUniversal = { org.gradle.api.Task t, String id ->
    if (isComposite(id)) {
        t.dependsOn gradle.includedBuild(moduleDirById[id].name).task(':universalJar')
    } else {
        ['fabric', 'neoforge'].each { l -> t.dependsOn gradle.includedBuild(moduleBuildName(id, l)).task(':build') }
    }
}

// Optional single-loader restriction for the loader stages: -Ploader=fabric|neoforge. Unset builds
// both loaders. The universal stages always merge both, so they ignore it.
def loaderFilter = (findProperty('loader') ?: '').toString().toLowerCase()
if (loaderFilter && loaderFilter != 'fabric' && loaderFilter != 'neoforge') {
    throw new GradleException("Invalid -Ploader='${loaderFilter}' (expected 'fabric' or 'neoforge')")
}
def activeLoaders = loaderFilter ? [loaderFilter] : ['fabric', 'neoforge']

// --- library freshness ----------------------------------------------------------------
// Hosts resolve the library from repo/, but Loom caches its remapped copy: editing library sources
// without a version bump would leave them compiling against the stale cache. Fingerprint the
// library sources and, only when that changes, republish it and drop the dependents' remapped
// artifacts. An unchanged library leaves normal builds untouched (the task stays up-to-date).
// The library's directory comes from module.properties' library=true, so this is not tied to a name.
def libraryDir = moduleDirById[libraryId]
def librarySrcTree = fileTree(dir: libraryDir, include: '**/src/**')
def libraryFingerprintFile = layout.buildDirectory.file('library-fingerprint.txt')
def libraryFingerprintDigest = { ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    def base = projectDir.absolutePath
    librarySrcTree.files.findAll { it.isFile() }.sort { it.path }.each { File f ->
        digest.update(f.absolutePath.substring(base.length()).replace('\\', '/').getBytes('UTF-8'))
        digest.update(f.bytes)
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}
def libraryFingerprintNow = libraryFingerprintDigest()
def libraryFingerprintStored = {
    def f = libraryFingerprintFile.get().asFile
    f.exists() ? f.text.trim() : ''
}()
def libraryChanged = libraryFingerprintNow != libraryFingerprintStored

tasks.register('ensureLibrary') {
    group = 'build'
    description = 'Republishes the library and clears dependent Loom caches when its sources changed.'
    inputs.files(librarySrcTree)
    outputs.file(libraryFingerprintFile)
    if (libraryChanged) {
        ['fabric', 'neoforge'].each { l ->
            dependsOn gradle.includedBuild(moduleBuildName(libraryId, l))
                    .task(':publishMavenJavaPublicationToRepoRepository')
        }
    }
    doLast {
        if (!libraryChanged) {
            return
        }
        def removed = 0
        file(versionRoot).listFiles()?.findAll { it.isDirectory() }?.each { modDir ->
            ['fabric', 'neoforge'].each { loader ->
                def remapped = new File(modDir, "${loader}/.gradle/loom-cache/remapped_mods")
                if (!remapped.isDirectory()) {
                    return
                }
                def stale = []
                remapped.eachFileRecurse { f ->
                    if (f.path.replace('\\', '/').contains('mc_storage_area_network')) {
                        stale << f
                    }
                }
                // Deepest first so files are removed before the directories that hold them.
                stale.sort { a, b -> b.path.length() <=> a.path.length() }.each { f ->
                    if (f.exists() && f.delete()) {
                        removed++
                    }
                }
            }
        }
        libraryFingerprintFile.get().asFile.text = libraryFingerprintNow
        logger.lifecycle("ensureLibrary: ${libraryId} republished and dependents de-cached " +
                "(${libraryFingerprintNow}, ${removed} stale entries)")
    }
}

// --- generated container metadata -------------------------------------------------------------------
// A bundle's fabric.mod.json, neoforge.mods.toml and jarjar metadata.json are written here rather
// than kept as template files, so a module's id, group, version and nested jar path are read from
// module.properties and versions.properties instead of being copied into 16 hand-written
// directories. The jar paths and the renames below come from the same nestedName/nestedPath, so the
// declared path and the file actually placed there cannot disagree.
//
// JarJar's identifier is only used to detect conflicting nested jars (ContainedJarIdentifier is
// {group, artifact} and is never compared against the nested mod's own modId), so the artifact is
// spelled from the module id for consistency with the maven artifactId.
def generatedMetadata = { String bundleName, String kind, List<String> ids, String version ->
    def dir = layout.buildDirectory.dir("generated/bundles/${bundleName}/${kind}").get().asFile
    new File(dir, 'META-INF/jarjar').mkdirs()   // the toml sits in META-INF, the jarjar metadata below it
    def json = groovy.json.JsonOutput
    def modId = bundleModId(bundleName, kind)
    def display = bundleDisplayName(bundleName, kind)
    def blurb = bundleDescription(bundleName, kind)
    def license = loadModule(ids[0]).getProperty('license') ?: 'All-Rights-Reserved'
    def authors = loadModule(ids[0]).getProperty('authors') ?: 'Unknown'

    if (kind == 'fabric' || kind == 'universal') {
        def mods = ids.collect { [file: nestedPath(it, 'fabric')] }
        def fabric = [schemaVersion: 1, id: modId, version: version, name: display,
                      description: blurb, authors: [authors], license: license,
                      environment: '*', jars: mods]
        new File(dir, 'fabric.mod.json').text = json.prettyPrint(json.toJson(fabric)) + '\n'
    }
    if (kind == 'neoforge' || kind == 'universal') {
        def toml = 'modLoader="javafml"\n' +
                'loaderVersion="[1,)"\n' +
                "license=\"${license}\"\n\n" +
                '[[mods]]\n' +
                "modId=\"${modId}\"\n" +
                "version=\"${version}\"\n" +
                "displayName=\"${display}\"\n" +
                "description='''${blurb}'''\n"
        new File(dir, 'META-INF/neoforge.mods.toml').text = toml
        def jarjar = [jars: ids.collect { id ->
            [identifier : [group: loadModule(id).getProperty('group'),
                           artifact: "${id}-neoforge"],
             version    : [range: '[1,)', artifactVersion: moduleVersion(id)],
             path       : nestedPath(id, 'neoforge'),
             isObfuscated: false]
        }]
        new File(dir, 'META-INF/jarjar/metadata.json').text = json.prettyPrint(json.toJson(jarjar)) + '\n'
    }
    return dir
}

/**
 * Universal library jar: thin container nesting the loader-specific library jars so each loader
 * loads only its own copy of the library's public api package. The root builds this one because the
 * library is a split module with no build root of its own to build it in.
 */
// The library universal container's metadata, generated rather than read from bundler/.
def generateLibraryUniversalMetadata = tasks.register('generateLibraryUniversalMetadata') {
    group = 'build'
    description = 'Generate the library universal container metadata.'
    def libVersion = moduleVersion(libraryId)
    def props = loadModule(libraryId)
    inputs.property 'libraryVersion', libVersion
    inputs.property 'libraryId', libraryId
    def outDir = layout.buildDirectory.dir('generated/bundles/library/universal')
    outputs.dir outDir
    doLast {
        def dir = outDir.get().asFile
        new File(dir, 'META-INF/jarjar').mkdirs()
        def json = groovy.json.JsonOutput
        def modId = 'mc_storage_area_network_bundle'
        // The library container is the one bundle with no bundles.properties entry: it carries the
        // library alone, and its description explains why it exists at all.
        def display = "${props.getProperty('name')} (Universal)"
        def blurb = "Universal distribution of the ${props.getProperty('name')}. Bundles the Fabric " +
                "and NeoForge builds; each loader loads only its own nested copy, so the public " +
                "${props.getProperty('group')}.api package stays intact."
        new File(dir, 'fabric.mod.json').text = json.prettyPrint(json.toJson(
                [schemaVersion: 1, id: modId, version: libVersion, name: display,
                 description: blurb, authors: [props.getProperty('authors')],
                 license: props.getProperty('license'), environment: '*',
                 jars: [[file: nestedPath(libraryId, 'fabric')]]])) + '\n'
        new File(dir, 'META-INF/neoforge.mods.toml').text =
                'modLoader="javafml"\nloaderVersion="[1,)"\n' +
                "license=\"${props.getProperty('license')}\"\n\n[[mods]]\n" +
                "modId=\"${modId}\"\nversion=\"${libVersion}\"\n" +
                "displayName=\"${display}\"\ndescription='''${blurb}'''\n"
        new File(dir, 'META-INF/jarjar/metadata.json').text = json.prettyPrint(json.toJson(
                [jars: [[identifier: [group: props.getProperty('group'),
                                      artifact: "${libraryId}-neoforge"],
                         version: [range: '[1,)', artifactVersion: libVersion],
                         path: nestedPath(libraryId, 'neoforge'), isObfuscated: false]]])) + '\n'
    }
}

/**
 * Universal library jar: thin container nesting the loader-specific library jars so each loader
 * loads only its own copy of the library's public api package. The root builds this one because the
 * library is a split module with no build root of its own to build it in.
 */
tasks.register('libraryUniversalJar', Jar) {
    dependOnUniversal(delegate, libraryId)
        archiveFileName = jarFileName(libraryId, moduleVersion(libraryId), 'universal')
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(generateLibraryUniversalMetadata)
    ['fabric', 'neoforge'].each { l ->
        from({ def f = perLoaderJar(libraryId, l); f == null ? [] : f }) {
            into nestedDir(l)
            rename { nestedName(libraryId, l) }
        }
    }
}

/**
 * Bundle container. `fabMods` are nested under META-INF/jars (Fabric), `neoMods` under
 * META-INF/jarjar (NeoForge); one jar can only carry one mod per loader, hence the container.
 */
// `kind` and `bundleKey` replace the old compound artifactPrefix (e.g. "universal-bundle-all"),
// so the archive name comes from jarFileName like every other release artifact.
def registerBundle = { String taskName, String bundleName, String kind, String bundleVersion, List fabMods, List neoMods ->
    def ids = (fabMods + neoMods).unique()
    def suffix = bundleName.capitalize() + kind.capitalize()
    def genTask = tasks.register("generateBundle${suffix}") {
        group = 'build'
        description = "Generate the ${kind} container metadata for bundle '${bundleName}'."
        def outDir = layout.buildDirectory.dir("generated/bundles/${bundleName}/${kind}")
        inputs.property 'bundleVersion', bundleVersion
        inputs.property 'memberVersions', ids.collectEntries { [(it): moduleVersion(it)] }
        outputs.dir outDir
        doLast {
            generatedMetadata(bundleName, kind, ids, bundleVersion)
        }
    }
    def t = tasks.register(taskName, Jar) {
        def staged = delegate
        fabMods.each { m -> dependOnLoader(staged, m, 'fabric') }
        neoMods.each { m -> dependOnLoader(staged, m, 'neoforge') }
            archiveFileName = jarFileName("bundle-${bundleName}", bundleVersion, kind)
        destinationDirectory = layout.buildDirectory.dir('libs')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        from(genTask)
        fabMods.each { m ->
            from({ def f = perLoaderJar(m, 'fabric'); f == null ? [] : f }) {
                into 'META-INF/jars'
                rename { nestedName(m, 'fabric') }
            }
        }
        neoMods.each { m ->
            from({ def f = perLoaderJar(m, 'neoforge'); f == null ? [] : f }) {
                into 'META-INF/jarjar'
                rename { nestedName(m, 'neoforge') }
            }
        }
    }
    return t
}

// Every bundle in bundles.properties becomes three containers: a universal one carrying both
// loaders' copies, and one per loader. Iterating the map means a new bundle is a line in
// bundles.properties and nothing here.
bundleDefs.each { bundleName, spec ->
    def ids = spec.ids
    def bVersion = bundleVersionFor(ids)
    registerBundle("bundle${bundleName.capitalize()}Jar", bundleName, 'universal', bVersion, ids, ids)
    registerBundle("fabricBundle${bundleName.capitalize()}Jar", bundleName, 'fabric', bVersion, ids, [])
    registerBundle("neoforgeBundle${bundleName.capitalize()}Jar", bundleName, 'neoforge', bVersion, [], ids)
}

/**
 * The release is built in four ordered stages so a failure points at the layer that broke and a
 * single loader (or just the universal layer) can be rebuilt without pulling in everything:
 *   1. releaseLoaderJars        per-loader API jars + per-loader gameplay mod jars
 *   2. releaseLoaderBundles     the per-loader bundle containers
 *   3. releaseUniversal         the API universal container + universal gameplay mod jars
 *   4. releaseUniversalBundles  the universal bundle containers
 * `releaseJars` unions all four into build/release/ so a release always yields the full set.
 */
tasks.register('releaseLoaderJars', Sync) {
    def staged = delegate
    group = 'release'
    description = 'Stage the per-loader library and module jars (build/release-loader).'
    into layout.buildDirectory.dir('release-loader')

    // One line per loader, iterating the discovered modules: a new module stages itself.
    activeLoaders.each { l ->
        moduleDirById.keySet().sort().each { m ->
            dependOnLoader(staged, m, l)
            from({ def f = perLoaderJar(m, l); f == null ? [] : f }) {
                rename { jarFileName(m, moduleVersion(m), l) }
            }
        }
    }
}

tasks.register('releaseLoaderBundles', Sync) {
    group = 'release'
    description = 'Stage the per-loader bundle containers (build/release-loader-bundles).'
    into layout.buildDirectory.dir('release-loader-bundles')

    if (activeLoaders.contains('fabric')) {
        dependsOn 'fabricBundleAllJar', 'fabricBundleStorageJar', 'fabricBundleCraftingJar',
                'fabricBundleRoutingJar', 'fabricBundleAccessJar'
        from(tasks.named('fabricBundleAllJar'), tasks.named('fabricBundleStorageJar'),
                tasks.named('fabricBundleCraftingJar'), tasks.named('fabricBundleRoutingJar'),
                tasks.named('fabricBundleAccessJar'))
    }
    if (activeLoaders.contains('neoforge')) {
        dependsOn 'neoforgeBundleAllJar', 'neoforgeBundleStorageJar', 'neoforgeBundleCraftingJar',
                'neoforgeBundleRoutingJar', 'neoforgeBundleAccessJar'
        from(tasks.named('neoforgeBundleAllJar'), tasks.named('neoforgeBundleStorageJar'),
                tasks.named('neoforgeBundleCraftingJar'), tasks.named('neoforgeBundleRoutingJar'),
                tasks.named('neoforgeBundleAccessJar'))
    }
}

tasks.register('releaseUniversal', Sync) {
    def staged = delegate
    group = 'release'
    description = 'Stage the universal library container and universal module jars (build/release-universal).'
    into layout.buildDirectory.dir('release-universal')

    // The library is merged by the root (it is a split module with no root of its own); every
    // composite module merges its own universal jar, and the discovered set says which is which.
    dependsOn 'libraryUniversalJar'
    from(tasks.named('libraryUniversalJar'))
    moduleDirById.keySet().sort().findAll { it != libraryId }.each { m ->
        dependOnUniversal(staged, m)
        // The closure form matters: perUniversalJar() resolves at configuration time, and right
        // after a clean the jar does not exist yet, so an eager from(f) silently contributed
        // nothing and the release set came out four jars short with no failure. The per-loader jars
        // below were already lazy, which is why only the universals went missing. releaseJars'
        // doFirst check is what now catches a universal jar that really is missing.
        from({ def f = perUniversalJar(m); f == null ? [] : f }) {
            rename { jarFileName(m, moduleVersion(m), 'universal') }
        }
    }
}

tasks.register('releaseUniversalBundles', Sync) {
    group = 'release'
    description = 'Stage the universal bundle containers (build/release-universal-bundles).'
    into layout.buildDirectory.dir('release-universal-bundles')

    bundleDefs.keySet().each { bundleName ->
        def t = "bundle${bundleName.capitalize()}Jar"
        dependsOn t
        from(tasks.named(t))
    }
}

// The stages run in order; a filtered loader stage still comes first.
tasks.named('releaseLoaderBundles') { mustRunAfter 'releaseLoaderJars' }
tasks.named('releaseUniversal') { mustRunAfter 'releaseLoaderBundles' }
tasks.named('releaseUniversalBundles') { mustRunAfter 'releaseUniversal' }

// An API change must reach the hosts first (republish + de-cache before they compile).
['releaseLoaderJars', 'releaseLoaderBundles', 'releaseUniversal', 'releaseUniversalBundles'].each { n ->
    tasks.named(n) { dependsOn 'ensureLibrary' }
}

/**
 * Collects every release jar under build/release/ from the four staged dirs. Still the union, so a
 * release always yields the complete set regardless of how the individual stages were invoked.
 */
tasks.register('releaseJars', Sync) {
    group = 'release'
    description = 'Assemble the complete release jar set into build/release from the four stages.'
    dependsOn 'ensureLibrary'
    dependsOn 'releaseLoaderJars', 'releaseLoaderBundles', 'releaseUniversal', 'releaseUniversalBundles'
    into layout.buildDirectory.dir('release')

    // Fail loudly if any version-pinned module jar is missing, rather than silently assembling a
    // bundle without it. Derived from the discovered modules, so a new module is covered by this.
    doFirst {
        def missing = []
        moduleDirById.keySet().sort().each { m ->
            ['fabric', 'neoforge'].each { l ->
                if (perLoaderJar(m, l) == null) { missing << "${m}-${l}" }
            }
            if (isComposite(m) && perUniversalJar(m) == null) { missing << "${m}-universal" }
        }
        if (missing) {
            throw new GradleException("releaseJars: missing module jar(s): ${missing}; did every included build run?")
        }
    }

    // The staged dirs hold the renamed jars, so the union is a straight copy of their outputs.
    from(tasks.named('releaseLoaderJars'), tasks.named('releaseLoaderBundles'),
            tasks.named('releaseUniversal'), tasks.named('releaseUniversalBundles'))
}

// Targeted rebuilds: wipe just the loader or the universal stage outputs.
tasks.register('cleanLoader', Delete) {
    group = 'build'
    description = 'Deletes the loader stage output dirs so they are rebuilt from scratch.'
    delete layout.buildDirectory.dir('release-loader'), layout.buildDirectory.dir('release-loader-bundles')
}

tasks.register('cleanUniversal', Delete) {
    group = 'build'
    description = 'Deletes the universal stage output dirs so they are rebuilt from scratch.'
    delete layout.buildDirectory.dir('release-universal'), layout.buildDirectory.dir('release-universal-bundles')
}

tasks.named('build') {
    dependsOn 'releaseJars'
}

// Cleaning at the root cleans every included build too, so no stale jar of an older version
// can survive a release build. Iterated from the discovered modules, so a new module is included.
tasks.named('clean') {
    moduleDirById.keySet().sort().each { m ->
        if (isComposite(m)) {
            dependsOn gradle.includedBuild(moduleDirById[m].name).task(':clean')
        } else {
            ['fabric', 'neoforge'].each { l ->
                dependsOn gradle.includedBuild(moduleBuildName(m, l)).task(':clean')
            }
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(tasks.named('libraryUniversalJar'))
            artifactId = "mc-storage-area-network-${mc}"
        }
    }
    repositories {
        maven {
            name = 'repo'
            url = uri("${projectDir}/repo")
        }
        mavenLocal()
    }
}

// Publishes the per-loader library jars to mavenLocal (for local host builds).
tasks.register('publishLibrary') {
    group = 'publishing'
    description = 'Publishes the library Fabric and NeoForge jars to mavenLocal for modules to consume.'
    ['fabric', 'neoforge'].each { l ->
        dependsOn gradle.includedBuild(moduleBuildName(libraryId, l)).task(':publishToMavenLocal')
    }
}

// Publishes everything (per-loader jars + universal container) into the in-repo maven (repo/).
tasks.register('publishRepo') {
    group = 'publishing'
    description = 'Publishes the library (per-loader jars + universal container) into ./repo for modules and modders.'
    ['fabric', 'neoforge'].each { l ->
        dependsOn gradle.includedBuild(moduleBuildName(libraryId, l)).task(':publishMavenJavaPublicationToRepoRepository')
    }
    dependsOn 'publishMavenJavaPublicationToRepoRepository'
    finalizedBy 'pruneRepo'
}

// Keeps the in-repo maven small: newest 3 versions per artifact, with matching metadata.
tasks.register('pruneRepo') {
    group = 'publishing'
    description = 'Keeps only the newest 3 versions of each artifact in ./repo and refreshes maven-metadata.'
    doLast {
        def keep = 3
        def groupRoot = file('repo/com/retiredroca')
        if (!groupRoot.exists()) {
            return
        }
        groupRoot.eachDir { groupDir ->
            groupDir.eachDir { artifactDir ->
                def versionDirs = artifactDir.listFiles().findAll { it.isDirectory() }
                if (versionDirs.isEmpty()) {
                    return
                }
                versionDirs.sort { a, b -> compareVersions(a.name, b.name) }
                if (versionDirs.size() > keep) {
                    def dropCount = versionDirs.size() - keep
                    versionDirs[0..<dropCount].each { it.deleteDir() }
                    versionDirs = versionDirs[dropCount..-1]
                }
                // Always refresh metadata from the directories that actually exist, so removing a
                // version out-of-band (e.g. migrating the version scheme) can't leave stale entries
                // that break dynamic/range resolution.
                def kept = versionDirs.collect { it.name }
                writeMetadata(artifactDir, "com.retiredroca.${groupDir.name}", artifactDir.name, kept)
                logger.lifecycle("pruneRepo: ${artifactDir.name} kept ${kept.join(', ')}")
            }
        }
    }
}

// Refuse to build a release set on a feature branch that never took its own version line: its jars
// would be named exactly like the released ones. Attached to the release tasks only, so ordinary
// development (`./gradlew build`) is unaffected. The check reads git at execution time, so it works
// the same in a worktree as in a plain checkout, and it is skipped on a detached HEAD (a CI
// checkout, which is the release line by definition).
['releaseLoaderJars', 'releaseLoaderBundles', 'releaseUniversal',
 'releaseUniversalBundles', 'releaseJars'].each { taskName ->
    tasks.matching { it.name == taskName }.configureEach {
        featureLineGuard(taskName)
    }
}
