# Bundle containers. Each bundle nests the per-loader jars of its modules under one install file.
#   bundle.<name>=<comma-separated module ids>
# One file, read by both sides: gradle/versions.gradle (or the root build) uses it to compute each
# bundle's version and to gather its members, and the release tooling reads it to decide which
# bundles a release actually changed. Adding a bundle needs no edit anywhere else.
bundle.all=mc_storage_area_network,storage_network,crafting_network,network_routing,remote_access_terminal
bundle.storage=mc_storage_area_network,storage_network
bundle.crafting=mc_storage_area_network,crafting_network
bundle.routing=mc_storage_area_network,storage_network,network_routing
bundle.access=mc_storage_area_network,remote_access_terminal
