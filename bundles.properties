# Bundle containers. Each bundle nests the per-loader jars of its modules under one install file.
#   bundle.<name>=<comma-separated module ids>
#   bundle.<name>.title=<display-name suffix, e.g. "Storage" -> "MC Storage Area Network (Storage)">
#   bundle.<name>.description=<the one-file-install sentence; the loader clause is appended>
#
# One file, read by both sides: the root build generates each container's metadata from it, and the
# release tooling reads it to decide which bundles a release changed and which jars to expect.
#
# The container metadata (fabric.mod.json / neoforge.mods.toml / jarjar metadata.json) is generated
# rather than kept as template files. It used to be 16 hand-written directories whose member lists,
# mod ids, maven groups and jar paths each had to be edited by hand whenever a module was added or
# renamed -- five copies of the same list per bundle, in nested jar names that were built from
# directory names (storage-network) rather than module ids (storage_network).
bundle.all=mc_storage_area_network,storage_network,crafting_network,network_routing,remote_access_terminal
bundle.all.title=All-in-One
bundle.all.description=One-file install: the MC Storage Area Network API plus Storage Network, Crafting Network, Network Routing and Remote Access Terminal.
bundle.storage=mc_storage_area_network,storage_network
bundle.storage.title=Storage
bundle.storage.description=One-file install: the MC Storage Area Network API plus Storage Network.
bundle.crafting=mc_storage_area_network,crafting_network
bundle.crafting.title=Crafting
bundle.crafting.description=One-file install: the MC Storage Area Network API plus Crafting Network.
bundle.routing=mc_storage_area_network,storage_network,network_routing
bundle.routing.title=Routing
bundle.routing.description=One-file install: the MC Storage Area Network API, Storage Network and Network Routing.
bundle.access=mc_storage_area_network,remote_access_terminal
bundle.access.title=Remote Access Terminal
bundle.access.description=One-file install: the MC Storage Area Network API plus Remote Access Terminal.
