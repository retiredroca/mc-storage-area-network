# Build/JVM settings. These only take effect from a build's OWN root directory: this file governs
# the composite build (root + every included build it configures in one daemon), while a build
# invoked directly with -p (e.g. `-p versions/1.21.1/api/neoforge`) reads that directory's
# gradle.properties instead. Keep the values identical across those files so one daemon can serve
# both, rather than starting a second, smaller one.
org.gradle.jvmargs=-Xmx12G -XX:MaxMetaspaceSize=1G -XX:+UseParallelGC

# The included builds (one per module per loader) are largely independent, so the build phase
# parallelises well; 28 cores are available here. workers.max is deliberately below the core count
# because each worker is its own JVM with its own heap.
org.gradle.parallel=true
org.gradle.workers.max=8
org.gradle.caching=true

org.gradle.java.home=C:\\Users\\Ric\\.gradle\\jdks\\eclipse_adoptium-21-amd64-windows.2

# Default Minecraft version to build (directory under versions/). Override with -Pmc=<version>.
mc=1.21.1
