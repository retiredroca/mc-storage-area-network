// Component versions live in the repo-root versions.properties (bumped only by the
// release workflow for the component that changed). This script locates that file
// from whichever build applies it and exposes the versions as project extensions.

// Every build finds the files it needs by walking up from its own projectDir, so a loader build
// under versions/<mc>/<module>/<loader>/ resolves the right files with no hardcoded paths.
def findUp = { String name ->
    def d = projectDir
    while (d != null && !new File(d, name).exists()) {
        d = d.parentFile
    }
    d == null ? null : new File(d, name)
}

def loadProps = { File f ->
    def p = new Properties()
    if (f != null) {
        f.withInputStream { p.load(it) }
    }
    return p
}

def versionsFile = findUp('versions.properties')
if (versionsFile == null) {
    throw new GradleException("versions.properties not found above ${projectDir}")
}

def componentVersions = new Properties()
versionsFile.withInputStream { componentVersions.load(it) }
ext.componentVersions = componentVersions

// Release jar name: <id>-<version>-<kind>.jar, e.g. storage_network-1.0.0.26092501-fabric.jar.
// The kind is the trailing element, so the loader designation sits last, matching the other
// projects in this scheme (redstone-pcbs, multiversion-mod-template). This is the only copy of
// the convention, and it is applied when *staging* the release set, deliberately NOT to
// archivesName: the per-module build/libs names feed the in-repo maven publications whose
// filenames hosts resolve, so renaming those would break every dependent module.
ext.jarFileName = { String id, String version, String loader -> "${id}-${version}-${loader}.jar" }

// Build-time version stamp. versions.properties may hold a bare "<major>.<minor>.<patch>" (before a
// release) or an already-stamped "<major>.<minor>.<patch>.<yymmddhh>" (after one). A bare value is
// stamped here, in the project's stamp timezone (TIMEZONE in tools/versioning.py), so built jars
// always carry the full version. Override with -PversionStamp=<stamp>; disable with -Pnostamp=true.
// Read a module-level string constant out of tools/versioning.py, so the value is declared once in
// python rather than duplicated here where the two can silently drift apart.
def pyConst = { String name, String fallback ->
    def f = findUp('tools/versioning.py')
    if (f == null) {
        return fallback
    }
    def m = f.getText('UTF-8') =~ /(?m)^${name}\s*=\s*"([^"]+)"/
    return m.find() ? m.group(1) : fallback
}
def stampTimezone = { pyConst('TIMEZONE', 'UTC') }
def fixedOffsetZone = { String name ->
    def t = name.trim().toUpperCase()
    if (t in ['UTC', 'Z', 'GMT']) {
        return java.time.ZoneOffset.UTC
    }
    def m = t =~ /^(?:UTC|GMT)?([+-])(\d{1,2})(?::?(\d{2}))?$/
    if (!m.matches()) {
        return null
    }
    int sign = m.group(1) == '+' ? 1 : -1
    int hours = m.group(2) as int
    int minutes = (m.group(3) ?: '0') as int
    return java.time.ZoneOffset.ofTotalSeconds(sign * (hours * 3600 + minutes * 60))
}
def resolveStampZone = { String name ->
    def fixed = fixedOffsetZone(name)
    if (fixed != null) {
        return fixed
    }
    try {
        return java.time.ZoneId.of(name)
    } catch (Exception ignored) {
        return java.time.ZoneOffset.UTC
    }
}
def currentStamp = {
    def override = project.findProperty('versionStamp')
    if (override != null) {
        return override.toString()
    }
    def zone = resolveStampZone(stampTimezone())
    return java.time.ZonedDateTime.now(zone)
            .format(java.time.format.DateTimeFormatter.ofPattern('yyMMddHH'))
}
def stampVersion = { String version ->
    if (version == null || project.findProperty('nostamp') != null) {
        return version
    }
    return version.tokenize('.').size() >= 4 ? version : "${version}.${currentStamp()}"
}
ext.stampVersion = stampVersion

// --- version ordering -----------------------------------------------------------------------------------
// The one place a version string becomes a comparable key. Every ordering decision -- which
// component a bundle takes its version from, which maven-metadata entry is newest, which loader
// version to resolve -- goes through here, so a change to what a version means is a change in one
// file. It lives in versions.gradle rather than version-resolver.gradle because versions.gradle is
// applied first by every build; a comparator defined in a script applied at the end is not available
// to the code above it, which is what previously forced a second copy into build.gradle.
//
// Cast, do not compare strings. A decimal component has no fixed width, so lexical order and numeric
// order must not be assumed to agree: '9' sorts after '10'. tokenize('.-+') and toInteger() make
// 1.0.9 < 1.0.10 and 1.0.99 < 1.0.100, at any width, with no zero-padding on the versions.
ext.versionKey = { String v -> v.tokenize('.-+').collect { it.isInteger() ? it.toInteger() : 0 } }
ext.compareVersions = { String a, String b ->
    def ka = versionKey(a)
    def kb = versionKey(b)
    for (int i = 0; i < Math.max(ka.size(), kb.size()); i++) {
        def x = i < ka.size() ? ka[i] : 0
        def y = i < kb.size() ? kb[i] : 0
        if (x != y) {
            return x <=> y
        }
    }
    0
}
ext.maxVersion = { List<String> versions ->
    // copy before sorting: sort() mutates in place, and a caller passing a shared list would see it
    // reordered as a side effect.
    versions ? new ArrayList(versions).sort { a, b -> compareVersions(a, b) }.last() : null
}


// Module identity (only present inside versions/<mc>/<module>/...). This is the single declaration
// of a module's id, group and the modules it depends on: the root build discovers modules by the
// presence of this file, the loader builds read it through findUp, and tools/versioning.py and
// tools/release.py read the same file. It is its own file rather than gradle.properties entries
// because a composite module's root build (versions/<mc>/<module>/build.gradle) is its own Gradle
// build root and cannot see a sub-build's project properties -- a mod_id in gradle.properties was
// invisible in exactly the place that needed it, which is why those roots hardcoded the id.
//
// Two kinds of module dependency, because they are two different facts and only one of them is a
// build input:
//
//   depends=  modules this build resolves against. They are published to the in-repo maven, so
//             there is a coordinate to depend on and a version to pin. network-routing's sources
//             import com.retiredroca.mcstorageareanetwork.api.* and nothing else of ours, so this
//             is the library and nothing more.
//   requires= modules this mod needs at runtime but cannot build against, because they are not
//             published. network-routing routes between storage containers, so it declares
//             storage_network required even though it only ever touches the library's abstractions
//             (ItemSourceRegistry, ScannedStorage, StorageRouter) that Storage Network implements.
//             Bundle-routing ships both, so the requirement is always met in a bundle.
//
// The mod's metadata declares the union of the two. It used to declare the runtime one as a
// hand-written "~1.0" / "[1.0.0,1.1)" in its own metadata, which no build step kept in step with
// versions.properties: bump storage_network to 1.1.0 and network-routing would ship declaring its
// own sibling incompatible with the copy nested beside it in the same archive, with the build green.
ext.mod_depends = []       // a build with no module.properties above it has no dependencies
ext.mod_requires = []
ext.mod_runtime_depends = []
def moduleFile = findUp('module.properties')
if (moduleFile != null) {
    def module = loadProps(moduleFile)
    ext.moduleProperties = module
    ext.mod_id = module.getProperty('id')
    ext.mod_name = module.getProperty('name')
    ext.mod_group_id = module.getProperty('group')
    ext.mod_authors = module.getProperty('authors')
    ext.mod_license = module.getProperty('license')
    ext.mod_description = module.getProperty('description')
    ext.mod_version = stampVersion(componentVersions.getProperty(ext.mod_id))
    ext.mod_library = (module.getProperty('library') ?: 'false').toBoolean()
    def idList = { String key ->
        (module.getProperty(key) ?: '').tokenize(',').collect { it.trim() }.findAll { it }
    }
    ext.mod_depends = idList('depends')
    ext.mod_requires = idList('requires')
    ext.mod_runtime_depends = (ext.mod_depends + ext.mod_requires).unique()
}

// The library module is the release line: its version is what the tag is keyed on and what every
// other module's floor is derived from. Modules find it through their own module.properties
// (library=true, and mod_depends names it); the root project has no module.properties above it, so
// the root build resolves the library from its own module scan instead.
ext.floorUpper = pyConst('FLOOR_UPPER', '1.1')   // single source: tools/versioning.py

// Sibling modules. A module's build needs the group and version floor of each id in its
// module.properties `depends=`, and those live in the dependency's own module.properties -- which is
// not an ancestor of this build, so findUp cannot reach it. Scanning versions/<mc>/ here means the
// root build, the composite module roots and the loader builds all resolve module identity the same
// way, instead of each keeping its own idea of it.
def mcSelected = providers.gradleProperty('mc').getOrElse('1.21.1')
def versionsBase = new File(versionsFile.parentFile, "versions/${mcSelected}")
ext.moduleProps = [:]
ext.moduleDirById = [:]
(versionsBase.listFiles() ?: new File[0]).sort { it.name }.each { d ->
    if (!d.isDirectory()) {
        return
    }
    def f = new File(d, 'module.properties')
    if (!f.exists()) {
        return
    }
    def p = loadProps(f)
    def id = p.getProperty('id')
    if (id) {
        ext.moduleProps[id] = p
        ext.moduleDirById[id] = d
    }
}

ext.moduleGroup = { String id ->
    def p = moduleProps[id]
    if (p == null) {
        throw new GradleException("No module '${id}' under versions/${mcSelected} (known: ${moduleProps.keySet().sort()})")
    }
    return p.getProperty('group')
}

ext.moduleFloorOf = { String id ->
    if (!moduleProps.containsKey(id)) {
        throw new GradleException("No module '${id}' under versions/${mcSelected} " +
                "(known: ${moduleProps.keySet().sort()}) -- check depends=/requires= in module.properties")
    }
    def version = componentVersions.getProperty(id)
    if (version == null) {
        throw new GradleException("versions.properties has no '${id}=' entry (modules: ${moduleProps.keySet().sort()})")
    }
    return version.tokenize('.').take(3).join('.')
}

// A dependency's floor range: [<major.minor.patch>,<floorUpper>), read from versions.properties at
// configuration time. This is what replaces the hand-written "~1.0.2" / "[1.0.2,1.1)" literals that
// used to sit in every host's metadata and in every host's gradle.properties, maintained by
// rewriting those files on each bump. Deriving it means the declared dependency is the one the build
// actually resolves against, and a renamed or missing key stops the build instead of quietly
// publishing a range that matches nothing.
ext.moduleFloor = { String id -> "[${moduleFloorOf(id)},${floorUpper})" }

// One token per runtime dependency for processResources, so a metadata file can write
// "~${mc_storage_area_network_range}" / versionRange="${mc_storage_area_network_range}" and have the
// floor follow versions.properties. The range syntax stays visible in the metadata file, where a
// reader expects it, and only the number is substituted. Both `depends=` and `requires=` get a token:
// the mod's metadata declares the union, whether or not the build resolves it.
ext.dependencyTokens = { ->
    def t = [:]
    mod_runtime_depends.each { dep -> t["${dep}_range"] = moduleFloorOf(dep) }
    return t
}

// Selecting a bundle version is maxVersion over the member modules, above. It is deliberately
// not a "newest stamp wins" rule over a fixed prefix: a version is ordered as a whole, and a string
// max over the stamp column would rank them lexically.

// Multi-version: loader builds live under versions/<mc>/, so each finds its own per-version
// pins (MC/loader/toolchain) by walking up for version.properties. Exposes the MC version so
// maven artifact ids and dependencies can be scoped to it.
def versionPropsFile = {
    def d = projectDir
    while (d != null && !new File(d, 'version.properties').exists()) {
        d = d.parentFile
    }
    d == null ? null : new File(d, 'version.properties')
}()
ext.versionPropsFile = versionPropsFile
ext.targetMc = versionPropsFile?.parentFile?.name

// Per-version Minecraft/toolchain pins live in versions/<mc>/version.properties. They are exposed
// here under their original gradle.properties names, so build scripts keep using ${minecraft_version},
// ${loader_version}, ${neo_version}, etc. unchanged.
if (versionPropsFile != null) {
    def versionPins = new Properties()
    versionPropsFile.withInputStream { versionPins.load(it) }
    ['minecraft_version', 'loader_version', 'fabric_version',
     'neo_version', 'neo_version_range', 'java_version', 'toolchain_era'].each { key ->
        def value = versionPins.getProperty(key)
        if (value != null) {
            ext.set(key, value)
        }
    }
}

// --- feature-line guard ---------------------------------------------------------------------------------
// A feature branch must be on its own version line, or its jars are indistinguishable by filename
// from the released line's and a test instance cannot tell them apart. The bump is the tooling's
// job (release.py --bump); this refuses to produce a jar when it has not happened.
//
// The test is "has this branch modified versions.properties since it diverged from the release
// line?", NOT "does its patch differ from main's": a branch stacked on another feature branch
// inherits that branch's number without ever having bumped, and a patch-equality test would call it
// clean. merge-base answers it exactly, and works the same in a worktree (no checkout event fires
// there) as in a plain checkout.
//
// Wired to the release tasks only, so ordinary development is unaffected. Detached HEAD means a CI
// checkout, which is the release line by definition. -PallowUnbumped=true is the escape hatch for
// reproducing or bisecting a release build; it is logged rather than silent.
ext.featureLineGuard = { String taskName ->
    if (project.findProperty('allowUnbumped') != null) {
        logger.lifecycle("mechanics: -PallowUnbumped=true set, skipping the feature-line check for ${taskName}")
        return
    }
    def git = { List<String> args ->
        def p = ['git'] + args
        try {
            def proc = new ProcessBuilder(p).directory(rootProject.projectDir).redirectErrorStream(true).start()
            def out = proc.inputStream.text.trim()
            proc.waitFor()
            return proc.exitValue() == 0 ? out : null
        } catch (Exception ignored) {
            return null
        }
    }
    // Not a git checkout, or not on a branch: nothing to compare against.
    def branch = git(['rev-parse', '--abbrev-ref', 'HEAD'])
    if (branch == null || branch == '' || branch == 'HEAD' || branch == 'main') {
        return
    }
    def base = git(['merge-base', 'HEAD', 'main'])
    if (base == null || base == '') {
        return
    }
    def here = versionsFile == null ? null : versionsFile.getText('UTF-8')
    def there = git(['show', base + ':versions.properties'])
    if (here == null || there == null) {
        return
    }
    if (here.trim() == there.trim()) {
        throw new GradleException(
            """Feature branch '${branch}' is still on the release line's version.
  Its jars would be named exactly like the released ones, so a test instance cannot tell a
  branch build from the release. Give this branch its own line, then rebuild:

      python tools/release.py --mod all --bump patch --commit

  Use --bump minor or --bump major if the line should start above a patch. To reproduce or
  bisect a release build on purpose, pass -PallowUnbumped=true.""")
    }
    logger.lifecycle("mechanics: feature branch '${branch}' is on its own version line")
}
