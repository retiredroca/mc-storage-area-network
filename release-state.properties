# Platform ids written back by the release workflow. Kept separate from
# versions.properties so a version bump never clobbers them.
#
# Keys are scoped to the Minecraft version (suffix .<mc>), so each supported version keeps
# its own CurseForge "SAN API" file id and Modrinth version ids.
#
# cf.api.file.<mc>       : CurseForge file id of the current "SAN API" entry. Updated
#                          storage/crafting/routing jars are attached to it via parentFileID.
# mr.api.version.<mc>    : Modrinth version id for the SAN API project.
# mr.storage.version.<mc>: Modrinth version id for the storage project.
# mr.crafting.version.<mc>: Modrinth version id for the crafting project.
# mr.routing.version.<mc>: Modrinth version id for the routing project.
cf.api.file.1.21.1=8885103
mr.api.version.1.21.1=
mr.storage.version.1.21.1=
mr.crafting.version.1.21.1=
mr.routing.version.1.21.1=
