# Single source of truth for component versions.
#
# The release workflow bumps ONLY the component(s) that changed (the trigger's mod),
# then commits this file back to main. Every Gradle build reads it instead of the
# wall clock, so an unchanged component is never re-versioned.
#
# Scheme <major>.<minor>.<patch>.<yymmddhh>: the trailing yymmddhh stamp is bumped
# automatically (Hawaii Standard Time, UTC-10) for the component(s) that changed; the patch (3rd
# component) is edited manually. Hosts depend on the API with a floor range derived
# from its first three components (see tools/versioning.py).
#
# api     : 1.0.<patch>.<yymmddhh>   (the shared API library)
# storage : 1.0.0.<yymmddhh>         (Storage Network gameplay mod)
# crafting: 1.0.0.<yymmddhh>         (Crafting Network gameplay mod)
# routing : 1.0.0.<yymmddhh>         (Network Routing gameplay mod)
# access  : 1.0.0.<yymmddhh>         (Remote Access Terminal gameplay mod)
#
# Bundle versions are derived from these at build time (1.0.0.<newest contained stamp>).
api=1.0.2.26092501
storage=1.0.0.26092501
crafting=1.0.0.26092501
routing=1.0.0.26092501
access=1.0.0.26092501
