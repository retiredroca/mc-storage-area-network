# Single source of truth for module versions.
#
# The release tooling bumps ONLY the module(s) that changed (the trigger's mod),
# then commits this file back to main. Every Gradle build reads it instead of the
# wall clock, so an unchanged module is never re-versioned.
#
# The keys are module ids, and they are the same string as the module's release jar
# name, its in-repo maven artifactId and its assets/data namespace. That is the point:
# there is no translation table between a module's identity here and everywhere else,
# so none can drift. The ids are declared once, in each module's module.properties.
#
# Scheme <major>.<minor>.<patch>.<yymmddhh>: the trailing yymmddhh stamp is bumped
# automatically (Hawaii Standard Time, UTC-10) for the module(s) that changed; the
# <major>.<minor>.<patch> line is a deliberate decision made by running the tooling
# (tools/release.py --bump patch|minor|major) rather than by editing this file.
#
#   mc_storage_area_network : the shared API library; the release line. Every other
#                             module depends on it with a floor range derived from the
#                             first three components below (see moduleFloor in
#                             gradle/versions.gradle and floor() in tools/versioning.py).
#   storage_network         : Storage Network
#   crafting_network        : Crafting Network
#   network_routing         : Network Routing
#   remote_access_terminal  : Remote Access Terminal
#
# Bundle versions are derived from these at build time as the highest version among a
# bundle's members, so a bundle's major.minor.patch tracks its own contents.
mc_storage_area_network=1.0.2.26100620
storage_network=1.0.0.26100620
crafting_network=1.0.0.26100620
network_routing=1.0.0.26100620
remote_access_terminal=1.0.0.26100620

# Project abbreviation, prepended to every release jar name (see jarFileName in
# gradle/versions.gradle) so jars from different projects cannot collide side by side.
abbrev=mcsan
