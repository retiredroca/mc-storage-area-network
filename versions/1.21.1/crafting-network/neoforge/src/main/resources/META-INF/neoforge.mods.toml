modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
An upgradable Crafting Terminal for Minecraft. Like the Storage Terminal, it scans nearby chunks for storage containers; place a crafting blueprint in its 3x3 grid and it crafts using items drawn from those containers and your inventory. Upgrade the terminal to increase its scan radius.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="mc_storage_area_network"
    type="required"
    versionRange="[1.0.2,1.1)"
    ordering="AFTER"
    side="BOTH"