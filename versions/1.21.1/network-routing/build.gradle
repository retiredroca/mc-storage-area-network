plugins {
    id 'base'
}

def repoRoot = projectDir
while (repoRoot != null && !new File(repoRoot, 'gradle/versions.gradle').exists()) {
    repoRoot = repoRoot.parentFile
}
apply from: new File(repoRoot, 'gradle/versions.gradle')

// Network Routing version from versions.properties (bumped only when it changed).
version = routingVersion
group = 'com.retiredroca.networkrouting'

// Exact, version-pinned lookup of a loader jar, matching the name the loader build writes. A scan
// for "the newest jar in the directory" would accept a mis-named or stale file; naming it exactly
// means a wrong name fails the build instead of silently packaging the wrong jar.
def loaderJar = { String loader, String version ->
    def f = file("${loader}/build/libs/${jarFileName('network_routing', version, loader)}")
    f.exists() ? f : null
}

/**
 * Universal jar: contains common + fabric classes + fabric.mod.json from the Fabric build, and the
 * NeoForge-only classes + neoforge.mods.toml from the NeoForge build. Each loader reads only its own
 * metadata and entrypoint, so the same jar loads on both.
 */
tasks.register('universalJar', Jar) {
    dependsOn gradle.includedBuild('fabric').task(':build')
    dependsOn gradle.includedBuild('neoforge').task(':build')

    // Named from the maven mod id, not the directory name, so the universal jar matches the
    // per-loader jars: <mod-id>-<version>-universal.jar. This build publishes nothing, so the
    // name is free to change.
    archiveFileName = jarFileName('network_routing', routingVersion, 'universal')
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from({
        def jar = loaderJar('fabric', routingVersion)
        jar == null ? [] : zipTree(jar)
    })
    from({
        def jar = loaderJar('neoforge', routingVersion)
        jar == null ? [] : zipTree(jar)
    }) {
        include 'com/retiredroca/networkrouting/neoforge/**'
        include 'META-INF/neoforge.mods.toml'
    }
}

tasks.named('build') {
    dependsOn 'universalJar'

    // This module's build/libs also accumulates every version ever built, including
    // jars left under the old hyphenated names. A root lookup pointing at one of those
    // would resolve a stale jar while the build reports success. .toString() is
    // required: a GString never equals the String that File.name returns.
    doLast {
        def libs = layout.buildDirectory.dir('libs').get().asFile
        if (!libs.isDirectory()) {
            return
        }
        def keep = [jarFileName('network_routing', routingVersion, 'universal').toString()] as Set
        libs.listFiles()?.each { f ->
            if (f.isFile() && f.name.endsWith('.jar') && !keep.contains(f.name)) {
                f.delete()
            }
        }
    }
}

// Thin aliases so a parent build can request one loader half of this mod without building both.
tasks.register('buildFabric') {
    dependsOn gradle.includedBuild('fabric').task(':build')
}

tasks.register('buildNeo') {
    dependsOn gradle.includedBuild('neoforge').task(':build')
}
