# Module identity, read by gradle/versions.gradle and the loader builds, and by tools/versioning.py
# and tools/release.py. The id is the maven mod id: it is the versions.properties key, the release
# jar name, the in-repo maven artifactId, and the module's assets/data namespace.
id=network_routing
name=Network Routing
group=com.retiredroca.networkrouting
authors=Retired Roca
license=Apache-2.0
description=Label storage containers with item filters and make matching containers win routing priority. Includes a chest-shaped Routing Terminal with a terminal-screen lid and a handheld Routing Linker.
# true => this module is a library published to the in-repo maven (repo/) for other modules to build against.
library=false
# Comma-separated module ids this build resolves against, i.e. the ones published to the in-repo
# maven. The floor range for each is derived from that module's versions.properties entry at
# configuration time, so a bump needs no edit here.
#
# Only the library: this mod's sources import com.retiredroca.mcstorageareanetwork.api.* and nothing
# else of ours, so there is nothing to compile against beyond the api.
depends=mc_storage_area_network
# Comma-separated module ids required at runtime but NOT resolved by this build, because they are not
# published. The mod's metadata declares depends= and requires= together; the range for a requires=
# id is derived the same way, so it cannot go stale either.
#
# Storage Network is required because a Routing Terminal routes between storage containers: the
# terminals, the scanned storage and the priority rules all come from Storage Network, reached here
# through the api's abstractions (ItemSourceRegistry, ScannedStorage, StorageRouter) that it
# implements. bundle-routing ships both, so the requirement is always met in a bundle.
requires=storage_network
