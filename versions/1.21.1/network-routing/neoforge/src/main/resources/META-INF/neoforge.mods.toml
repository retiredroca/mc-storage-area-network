modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Label storage containers with item filters and make matching containers win routing priority. Includes a chest-shaped Routing Terminal with a terminal-screen lid and a handheld Routing Linker.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="mc_storage_area_network"
    type="required"
    versionRange="[1.0.2,1.1)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="storage_network"
    type="required"
    versionRange="[1.0,1.1)"
    ordering="AFTER"
    side="BOTH"
