# Module identity, read by gradle/versions.gradle and the loader builds, and by tools/versioning.py
# and tools/release.py. The id is the maven mod id: it is the versions.properties key, the release
# jar name, the in-repo maven artifactId, and the module's assets/data namespace.
id=remote_access_terminal
name=Remote Access Terminal
group=com.retiredroca.remoteaccessterminal
authors=Retired Roca
license=Apache-2.0
description=Dye-coloured remote access terminals: place one, name it, then link and travel between them. Break protection and scoreboard-team permissions come from the MC Storage Area Network API. Inspired by Jake Teleports by Neurlimon (https://www.curseforge.com/minecraft/mc-mods/jake-teleports, https://mcreator.net/modification/99707/jake-teleports).
# true => this module is a library published to the in-repo maven (repo/) for other modules to build against.
library=false
# Comma-separated module ids this one requires at runtime. The dependency range is derived from the
# library's versions.properties entry at configuration time, so a bump needs no edit here.
depends=mc_storage_area_network
