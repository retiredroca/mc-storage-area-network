plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def repoRoot = projectDir
while (repoRoot != null && !new File(repoRoot, 'gradle/versions.gradle').exists()) {
    repoRoot = repoRoot.parentFile
}
apply from: new File(repoRoot, 'gradle/versions.gradle')

// Storage Network version from versions.properties (bumped only when it changed).
version = mod_version
group = mod_group_id

// Name the jar here rather than via archiveClassifier: a classifier is inherited by the maven
// publication below and lands in repo/ as <artifactId>-<version>-fabric.jar, which no host can
// resolve. archiveFileName leaves the classifier empty and the published coordinate untouched.
base {
    archivesName = mod_id
}
tasks.named('jar') { archiveFileName = jarFileName(mod_id, mod_version, 'fabric') }
tasks.named('remapJar') { archiveFileName = jarFileName(mod_id, mod_version, 'fabric') }

repositories {
    maven {
        name = 'itemNetworkRepo'
        url = uri("${repoRoot}/repo")
    }
    mavenLocal()
    maven {
        name = 'itemNetwork'
        url = 'https://raw.githubusercontent.com/retiredroca/mc-storage-area-network/main/repo'
    }
}

// The shared sources are compiled once per loader. To let a single merged jar hold both the
// Fabric (intermediary) and NeoForge (Mojang) variants, each loader gets its own copy of the
// common classes under a loader-specific sub-package (e.g. ...storagenetwork.fabric.common.*),
// so the two mapping variants no longer collide by class name.
def commonPrefix = 'com.retiredroca.storagenetwork'
def relocatedPrefix = 'com.retiredroca.storagenetwork.fabric.common'

tasks.register('relocateCommonSources', Copy) {
    from(rootProject.file('../common/src/main/java'))
    into(layout.buildDirectory.dir('generated/common'))
    filter { String line ->
        line.replace(commonPrefix, relocatedPrefix)
    }
}

tasks.register('relocateLoaderSources', Copy) {
    from('src/main/java')
    into(layout.buildDirectory.dir('generated/loader'))
    filter { String line ->
        def matcher = line =~ /import com\.retiredroca\.storagenetwork\.(?!fabric\b|neoforge\b|mixin\b)([A-Za-z0-9_.]+);/
        if (matcher.find()) {
            return "import com.retiredroca.storagenetwork.fabric.common.${matcher.group(1)};"
        }
        return line
    }
}

sourceSets {
    main {
        java {
            srcDirs = []
            srcDir(tasks.named('relocateCommonSources'))
            srcDir(tasks.named('relocateLoaderSources'))
        }
        resources {
            // Gameplay assets/data live once in the shared common sources; only loader metadata
            // (fabric.mod.json / neoforge.mods.toml / mixins / AT) stays per-loader.
            srcDir(rootProject.file('../common/src/main/resources'))
        }
    }
}

loom {
    // Use Mojang mappings so the source matches the NeoForge build 1:1.
    officialMojangMappings()
}

dependencies {
    // Minecraft + Fabric loader + Fabric API
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // The modules this one depends on (module.properties `depends=`), resolved from the in-repo maven
    // by an exact artifactId and a floor range taken from that module's versions.properties entry.
    // The range is derived rather than declared here, so the version this build resolves against and
    // the version this mod declares at runtime cannot drift apart.
    mod_depends.each { dep ->
        modImplementation "${moduleGroup(dep)}:${dep}-fabric-${targetMc}:${moduleFloor(dep)}"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraft_version
    inputs.property "loader_version", loader_version
    inputs.property "mod_id", mod_id
    inputs.property "mod_name", mod_name
    inputs.property "mod_license", mod_license
    inputs.property "mod_authors", mod_authors
    dependencyTokens().each { token, value -> inputs.property token, value }

    filesMatching("fabric.mod.json") {
        // dependencyTokens() adds one "<dep-id>_range" token per entry in module.properties
        // `depends=`, carrying that dependency's floor. The "~" stays in the metadata file, so the
        // range syntax a reader cares about is visible there and only the number is substituted.
        def tokens = ["version"          : project.version,
                      "minecraft_version": minecraft_version,
                      "loader_version"   : loader_version,
                      "mod_id"           : mod_id,
                      "mod_name"         : mod_name,
                      "mod_license"      : mod_license,
                      "mod_authors"      : mod_authors] + dependencyTokens()
        expand tokens
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_id}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

// Keep only this build's jars in build/libs. Without this the directory accumulates every version
// ever built, and a root lookup that still points at an old filename will happily resolve a
// two-week-old jar while the build reports success. .toString() on each entry is required: a
// GString never equals the String that File.name returns, so a keep-set built from a closure would
// match nothing and delete the jar this build just produced.
tasks.named('build') {
    doLast {
        def libs = layout.buildDirectory.dir('libs').get().asFile
        if (!libs.isDirectory()) {
            return
        }
        def keep = [jarFileName(mod_id, mod_version, 'fabric').toString(),
                    jarFileName(mod_id, mod_version, 'sources').toString()] as Set
        libs.listFiles()?.each { f ->
            if (f.isFile() && f.name.endsWith('.jar') && !keep.contains(f.name)) {
                f.delete()
            }
        }
    }
}
